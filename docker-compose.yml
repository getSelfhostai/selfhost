# Local development database. Start with `docker compose up -d`.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: selfhost
      POSTGRES_USER: selfhost
      POSTGRES_PASSWORD: selfhost
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U selfhost -d selfhost"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
