version = 1

[egress]
mode = "enforce"
allow = ["github.com", "*.npmjs.org", "pypi.org", "10.0.0.0/8"]

[teams.payments.egress]
allow = ["github.com", "registry.npmjs.org"]

[teams.payments.rules."egress.allow"]
mode = "enforce"

[secrets.env]
GITHUB_TOKEN = "github-app:repo"
SENTRY_DSN = "env:SENTRY_DSN"
DATABASE_URL = "vault:acme-api/ci#database_url"
STRIPE_KEY = { from = "infisical:/payments#STRIPE_KEY", host = "api.stripe.com", header = "Authorization", format = "Bearer {value}" }

[secrets.vault]
url = "https://vault.acme.test:8200"
mount = "kv"

[secrets.infisical]
project_id = "proj-acme"
environment = "ci"

[secrets.github_permissions]
contents = "write"
pull_requests = "write"
metadata = "read"
