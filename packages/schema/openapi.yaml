          type: array
          items:
            $ref: "#/components/schemas/LedgerEvent"
        cursor:
          description: Pass as after to get what lands next.
          type: string
        people:
          description: "The person each event belongs to, by event id, for events whose actor is not a person (an agent, the policy engine): who sent it, else the person of its session."
          type: object
          patternProperties:
            ^(.*)$:
              type: string
    BackgroundRun:
      additionalProperties: false
      title: BackgroundRun
      description: One background run, as GET /v1/background-runs/{id} answers it.
      type: object
      required:
        - schema
        - id
        - team
        - repo
        - task
        - agent
        - runtime
        - state
        - reason
        - person
        - trigger
        - credential
        - base
        - branch
        - sandbox_id
        - attempt
        - max_attempts
        - timeout_minutes
        - pr_url
        - created_at
        - started_at
        - ended_at
        - updated_at
        - cancel
        - cost
        - health
        - gate
      properties:
        schema:
          const: selfhost.background_run/v1
          type: string
        id:
          minLength: 1
          description: Run id, also run_id on the run's ledger events.
          type: string
        team:
          minLength: 1
          description: The team the run belongs to.
          type: string
        org:
          description: The team's org.
          type: string
        repo:
          pattern: ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$
          description: Repository as owner/name.
          type: string
        task:
          minLength: 1
          description: What the agent was asked to do.
          type: string
        agent:
          description: The agent CLI.
          type: string
          enum:
            - claude
            - codex
            - opencode
            - goose
        runtime:
          minLength: 1
          description: The runtime kind the sandbox ran on, such as e2b.
          type: string
        state:
          type: string
          enum:
            - queued
            - starting
            - running
            - testing
            - pushing
            - succeeded
            - failed
            - cancelled
            - timed_out
            - stuck
        reason:
          description: Why the run ended as it did, or why it is waiting. null while normal.
          anyOf:
            - type: string
            - type: "null"
        person:
          description: The person the run works for, whose login the agent uses. null for runs with no person.
          anyOf:
            - type: string
            - type: "null"
        trigger:
          additionalProperties: false
          title: RunTrigger
          description: Who or what started a run.
          type: object
          required:
            - source
            - sender
            - person
          properties:
            source:
              description: Where the run came from.
              type: string
              enum:
                - cli
                - api
                - console
                - github_comment
                - github_label
                - schedule
                - webhook
            sender:
              minLength: 1
              description: "Who sent it, as the source names them: a GitHub login, a webhook's sender field, a schedule name, or a selfhost person id for the CLI, API and console."
              type: string
            person:
              description: The selfhost person the sender maps to, or null for a schedule, or a sender with no mapping.
              anyOf:
                - type: string
                - type: "null"
            ref:
              description: "What the trigger points at: the issue or pull request URL, the schedule name, or the webhook delivery id."
              type: string
        credential:
          description: What the agent signed in with, once the sandbox is set up.
          anyOf:
            - type: string
              enum:
                - person_login
                - team_api_key
                - gateway_key
                - none
            - type: "null"
        base:
          description: The branch the run was cut from, once known.
          anyOf:
            - type: string
            - type: "null"
        branch:
          minLength: 1
          description: The run's own branch. Two runs never share one.
          type: string
        sandbox_id:
          description: The sandbox, while it exists.
          anyOf:
            - type: string
            - type: "null"
        attempt:
          minimum: 1
          description: Current attempt, 1 for the first.
          type: integer
        max_attempts:
          minimum: 1
          description: 1 plus [background] max_retries.
          type: integer
        timeout_minutes:
          minimum: 1
          type: integer
        pr_url:
          description: The run's one pull request.
          anyOf:
            - format: uri
              type: string
            - type: "null"
        created_at:
          format: date-time
          type: string
        started_at:
          description: When the sandbox was asked for.
          anyOf:
            - format: date-time
              type: string
            - type: "null"
        ended_at:
          description: When the run reached a final state.
          anyOf:
            - format: date-time
              type: string
            - type: "null"
        updated_at:
          format: date-time
          type: string
        cancel:
          description: Who stopped the run, and through which switch, once someone did.
          anyOf:
            - additionalProperties: false
              type: object
              required:
                - by
                - at
                - scope
              properties:
                by:
                  minLength: 1
                  type: string
                at:
                  format: date-time
                  type: string
                scope:
                  type: string
                  enum:
                    - run
                    - team
                    - org
            - type: "null"
        cost:
          additionalProperties: false
          title: RunCost
          type: object
          required:
            - runtime_usd
            - model_usd
            - usd
            - source
          properties:
            runtime_usd:
              minimum: 0
              description: Sandbox time so far, as the runtime reports it or at its list price.
              type: number
            model_usd:
              minimum: 0
              description: "Model spend so far: cost.recorded events the run's gateway key or hooks wrote."
              type: number
            usd:
              minimum: 0
              description: runtime_usd plus model_usd.
              type: number
            source:
              description: Whether runtime_usd came from the provider or from the list price.
              type: string
              enum:
                - provider
                - list_price
        health:
          description: Run health at the last check, or null before the agent starts.
          anyOf:
            - additionalProperties: false
              title: RunHealth
              type: object
              required:
                - status
                - line
                - heartbeat_at
                - last_output_at
              properties:
                status:
                  description: "ok: output is flowing. quiet: no output for a while. stuck: run health stopped it. lost: the sandbox stopped answering."
                  type: string
                  enum:
                    - ok
                    - quiet
                    - stuck
                    - lost
                reason:
                  description: "Why it was stopped: no_output for stall_minutes, loop for the same tool call loop_repeats times in a row, or sandbox_lost."
                  type: string
                  enum:
                    - no_output
                    - loop
                    - sandbox_lost
                line:
                  minLength: 1
                  description: One line for the run view, such as `quiet for 6m`.
                  type: string
                heartbeat_at:
                  description: The sandbox's last heartbeat.
                  anyOf:
                    - format: date-time
                      type: string
                    - type: "null"
                last_output_at:
                  description: When the agent last printed anything.
                  anyOf:
                    - format: date-time
                      type: string
                    - type: "null"
                repeats:
                  minimum: 0
                  description: Identical tool calls in a row at the last check.
                  type: integer
                tool:
                  description: The tool call that repeated, summarized.
                  type: string
            - type: "null"
        gate:
          description: The tests-first gate's verdict, once it ran.
          anyOf:
            - additionalProperties: false
              title: RunGate
              description: The tests-first gate's verdict.
              type: object
              required:
                - mode
                - result
                - command
                - tests_changed
                - checks
                - summary
                - blocked
              properties:
                mode:
                  description: "[background] tests_first when the gate ran."
                  type: string
                  enum:
                    - off
                    - observe
                    - enforce
                result:
                  description: passed when every check passed, failed when one did, skipped when off.
                  type: string
                  enum:
                    - passed
                    - failed
                    - skipped
                command:
                  description: The test command, from selfhost.toml or detected, or null.
                  anyOf:
                    - type: string
                    - type: "null"
                command_from:
                  description: Where the test command came from.
                  type: string
                  enum:
                    - config
                    - package.json
                    - pyproject
                    - cargo
                    - go
                    - ci
                tests_changed:
                  description: Test files the run added or changed.
                  type: array
                  items:
                    type: string
                checks:
                  type: array
                  items:
                    additionalProperties: false
                    title: GateCheck
                    type: object
                    required:
                      - name
                      - ok
                      - detail
                    properties:
                      name:
                        description: "tests_first: a changed test fails on the base and passes on the head. tests_pass: the test command passes on the head. dependencies: every added package exists in its registry. size: the diff is under pr_size_cap."
                        type: string
                        enum:
                          - tests_first
                          - tests_pass
                          - dependencies
                          - size
                      ok:
                        type: boolean
                      detail:
                        minLength: 1
                        description: What was found, in one line.
                        type: string
                summary:
                  minLength: 1
                  description: One line, as the pull request check shows it.
                  type: string
                output:
                  description: The end of the failing test output, at most 4000 characters.
                  type: string
                blocked:
                  description: true when the gate stopped the pull request from opening (enforce only).
                  type: boolean
            - type: "null"
    BackgroundRunsResponse:
      additionalProperties: false
      title: BackgroundRunsResponse
      type: object
      required:
        - runs
        - kills
      properties:
        runs:
          description: Newest first.
          type: array
          items:
            additionalProperties: false
            title: BackgroundRun
            description: One background run, as GET /v1/background-runs/{id} answers it.
            type: object
            required:
              - schema
              - id
              - team
              - repo
              - task
              - agent
              - runtime
              - state
              - reason
              - person
              - trigger
              - credential
              - base
              - branch
              - sandbox_id
              - attempt
              - max_attempts
              - timeout_minutes
              - pr_url
              - created_at
              - started_at
              - ended_at
              - updated_at
              - cancel
              - cost
              - health
              - gate
            properties:
              schema:
                const: selfhost.background_run/v1
                type: string
              id:
                minLength: 1
                description: Run id, also run_id on the run's ledger events.
                type: string
              team:
                minLength: 1
                description: The team the run belongs to.
                type: string
              org:
                description: The team's org.
                type: string
              repo:
                pattern: ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$
                description: Repository as owner/name.
                type: string
              task:
                minLength: 1
                description: What the agent was asked to do.
                type: string
              agent:
                description: The agent CLI.
                type: string
                enum:
                  - claude
                  - codex
                  - opencode
                  - goose
              runtime:
                minLength: 1
                description: The runtime kind the sandbox ran on, such as e2b.
                type: string
              state:
                type: string
                enum:
                  - queued
                  - starting
                  - running
                  - testing
                  - pushing
                  - succeeded
                  - failed
                  - cancelled
                  - timed_out
                  - stuck
              reason:
                description: Why the run ended as it did, or why it is waiting. null while normal.
                anyOf:
                  - type: string
                  - type: "null"
              person:
                description: The person the run works for, whose login the agent uses. null for runs with no person.
                anyOf:
                  - type: string
                  - type: "null"
              trigger:
                additionalProperties: false
                title: RunTrigger
                description: Who or what started a run.
                type: object
                required:
                  - source
                  - sender
                  - person
                properties:
                  source:
                    description: Where the run came from.
                    type: string
                    enum:
                      - cli
                      - api
                      - console
                      - github_comment
                      - github_label
                      - schedule
                      - webhook
                  sender:
                    minLength: 1
                    description: "Who sent it, as the source names them: a GitHub login, a webhook's sender field, a schedule name, or a selfhost person id for the CLI, API and console."
                    type: string
                  person:
                    description: The selfhost person the sender maps to, or null for a schedule, or a sender with no mapping.
                    anyOf:
                      - type: string
                      - type: "null"
                  ref:
                    description: "What the trigger points at: the issue or pull request URL, the schedule name, or the webhook delivery id."
                    type: string
              credential:
                description: What the agent signed in with, once the sandbox is set up.
                anyOf:
                  - type: string
                    enum:
                      - person_login
                      - team_api_key
                      - gateway_key
                      - none
                  - type: "null"
              base:
                description: The branch the run was cut from, once known.
                anyOf:
                  - type: string
                  - type: "null"
              branch:
                minLength: 1
                description: The run's own branch. Two runs never share one.
                type: string
              sandbox_id:
                description: The sandbox, while it exists.
                anyOf:
                  - type: string
                  - type: "null"
              attempt:
                minimum: 1
                description: Current attempt, 1 for the first.
                type: integer
              max_attempts:
                minimum: 1
                description: 1 plus [background] max_retries.
                type: integer
              timeout_minutes:
                minimum: 1
                type: integer
              pr_url:
                description: The run's one pull request.
                anyOf:
                  - format: uri
                    type: string
                  - type: "null"
              created_at:
                format: date-time
                type: string
              started_at:
                description: When the sandbox was asked for.
                anyOf:
                  - format: date-time
                    type: string
                  - type: "null"
              ended_at:
                description: When the run reached a final state.
                anyOf:
                  - format: date-time
                    type: string
                  - type: "null"
              updated_at:
                format: date-time
                type: string
              cancel:
                description: Who stopped the run, and through which switch, once someone did.
                anyOf:
                  - additionalProperties: false
                    type: object
                    required:
                      - by
                      - at
                      - scope
                    properties:
                      by:
                        minLength: 1
                        type: string
                      at:
                        format: date-time
                        type: string
                      scope:
                        type: string
                        enum:
                          - run
                          - team
                          - org
                  - type: "null"
              cost:
                additionalProperties: false
                title: RunCost
                type: object
                required:
                  - runtime_usd
                  - model_usd
                  - usd
                  - source
                properties:
                  runtime_usd:
                    minimum: 0
                    description: Sandbox time so far, as the runtime reports it or at its list price.
                    type: number
                  model_usd:
                    minimum: 0
                    description: "Model spend so far: cost.recorded events the run's gateway key or hooks wrote."
                    type: number
                  usd:
                    minimum: 0
                    description: runtime_usd plus model_usd.
                    type: number
                  source:
                    description: Whether runtime_usd came from the provider or from the list price.
                    type: string
                    enum:
                      - provider
                      - list_price
              health:
                description: Run health at the last check, or null before the agent starts.
                anyOf:
                  - additionalProperties: false
                    title: RunHealth
                    type: object
                    required:
                      - status
                      - line
                      - heartbeat_at
                      - last_output_at
                    properties:
                      status:
                        description: "ok: output is flowing. quiet: no output for a while. stuck: run health stopped it. lost: the sandbox stopped answering."
                        type: string
                        enum:
                          - ok
                          - quiet
                          - stuck
                          - lost
                      reason:
                        description: "Why it was stopped: no_output for stall_minutes, loop for the same tool call loop_repeats times in a row, or sandbox_lost."
                        type: string
                        enum:
                          - no_output
                          - loop
                          - sandbox_lost
                      line:
                        minLength: 1
                        description: One line for the run view, such as `quiet for 6m`.
                        type: string
                      heartbeat_at:
                        description: The sandbox's last heartbeat.
                        anyOf:
                          - format: date-time
                            type: string
                          - type: "null"
                      last_output_at:
                        description: When the agent last printed anything.
                        anyOf:
                          - format: date-time
                            type: string
                          - type: "null"
                      repeats:
                        minimum: 0
                        description: Identical tool calls in a row at the last check.
                        type: integer
                      tool:
                        description: The tool call that repeated, summarized.
                        type: string
                  - type: "null"
              gate:
                description: The tests-first gate's verdict, once it ran.
                anyOf:
                  - additionalProperties: false
                    title: RunGate
                    description: The tests-first gate's verdict.
                    type: object
                    required:
                      - mode
                      - result
                      - command
                      - tests_changed
                      - checks
                      - summary
                      - blocked
                    properties:
                      mode:
                        description: "[background] tests_first when the gate ran."
                        type: string
                        enum:
                          - off
                          - observe
                          - enforce
                      result:
                        description: passed when every check passed, failed when one did, skipped when off.
                        type: string
                        enum:
                          - passed
                          - failed
                          - skipped
                      command:
                        description: The test command, from selfhost.toml or detected, or null.
                        anyOf:
                          - type: string
                          - type: "null"
                      command_from:
                        description: Where the test command came from.
                        type: string
                        enum:
                          - config
                          - package.json
                          - pyproject
                          - cargo
                          - go
                          - ci
                      tests_changed:
                        description: Test files the run added or changed.
                        type: array
                        items:
                          type: string
                      checks:
                        type: array
                        items:
                          additionalProperties: false
                          title: GateCheck
                          type: object
                          required:
                            - name
                            - ok
                            - detail
                          properties:
                            name:
                              description: "tests_first: a changed test fails on the base and passes on the head. tests_pass: the test command passes on the head. dependencies: every added package exists in its registry. size: the diff is under pr_size_cap."
                              type: string
                              enum:
                                - tests_first
                                - tests_pass
                                - dependencies
                                - size
                            ok:
                              type: boolean
                            detail:
                              minLength: 1
                              description: What was found, in one line.
                              type: string
                      summary:
                        minLength: 1
                        description: One line, as the pull request check shows it.
                        type: string
                      output:
                        description: The end of the failing test output, at most 4000 characters.
                        type: string
                      blocked:
                        description: true when the gate stopped the pull request from opening (enforce only).
                        type: boolean
                  - type: "null"
        kills:
          description: Kill switches in force that cover the listed teams.
          type: array
          items:
            additionalProperties: false
            type: object
            required:
              - scope
              - target
              - by
              - at
            properties:
              scope:
                type: string
                enum:
                  - team
                  - org
              target:
                minLength: 1
                type: string
              by:
                minLength: 1
                type: string
              at:
                format: date-time
                type: string
    StartRunRequest:
      additionalProperties: false
      title: StartRunRequest
      type: object
      required:
        - task
        - repo
      properties:
        task:
          minLength: 1
          description: What the agent is asked to do.
          type: string
        repo:
          pattern: ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$
          description: Repository as owner/name.
          type: string
        agent:
          type: string
          enum:
            - claude
            - codex
            - opencode
            - goose
        runtime:
          minLength: 1
          description: "Runtime kind; default: the team's [runtime] default."
          type: string
        team:
          minLength: 1
          description: "Default: the caller's team."
          type: string
        base:
          minLength: 1
          description: "Branch to start from; default: the repo's."
          type: string
        timeout_minutes:
          minimum: 1
          maximum: 1440
          type: integer
        source:
          description: "Which surface sent it; recorded on the trigger. Default: api."
          type: string
          enum:
            - cli
            - api
            - console
    WebhookRunRequest:
      additionalProperties: false
      title: WebhookRunRequest
      type: object
      required:
        - task
        - repo
        - sender
      properties:
        task:
          minLength: 1
          type: string
        repo:
          pattern: ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$
          type: string
        sender:
          minLength: 1
          description: The person id the bridge says sent it.
          type: string
        team:
          minLength: 1
          type: string
        agent:
          type: string
          enum:
            - claude
            - codex
            - opencode
            - goose
        ref:
          description: A link back to the message.
          type: string
    KillRequest:
      additionalProperties: false
      title: KillRequest
      type: object
      required:
        - scope
        - target
      properties:
        scope:
          type: string
          enum:
            - team
            - org
        target:
          minLength: 1
          description: The team id or org id.
          type: string
        reason:
          type: string
    KillResponse:
      additionalProperties: false
      title: KillResponse
      type: object
      required:
        - scope
        - target
        - active
        - stopped
      properties:
        scope:
          type: string
          enum:
            - team
            - org
        target:
          minLength: 1
          type: string
        active:
          description: true while new runs in the scope are refused.
          type: boolean
        stopped:
          description: Runs this call stopped.
          type: array
          items:
            minLength: 1
            type: string
    NotifyTarget:
      additionalProperties: false
      title: NotifyTarget
      type: object
      required:
        - name
        - service
        - masked
        - created_at
      properties:
        name:
          minLength: 1
          description: The person's name for the target, such as phone or email.
          type: string
        service:
          minLength: 1
          description: The Apprise URL's scheme, such as tgram, slack, mailto, msteams or ntfys.
          type: string
        masked:
          minLength: 1
          description: The URL with everything after the scheme hidden. The URL itself is never returned.
          type: string
        created_at:
          format: date-time
          type: string
    NotifySettings:
      additionalProperties: false
      title: NotifySettings
      type: object
      required:
        - person
        - targets
        - digest
        - digest_set
        - delivery
      properties:
        person:
          minLength: 1
          description: Whose settings these are.
          type: string
        targets:
          type: array
          items:
            additionalProperties: false
            title: NotifyTarget
            type: object
            required:
              - name
              - service
              - masked
              - created_at
            properties:
              name:
                minLength: 1
                description: The person's name for the target, such as phone or email.
                type: string
              service:
                minLength: 1
                description: The Apprise URL's scheme, such as tgram, slack, mailto, msteams or ntfys.
                type: string
              masked:
                minLength: 1
                description: The URL with everything after the scheme hidden. The URL itself is never returned.
                type: string
              created_at:
                format: date-time
                type: string
        digest:
          description: "The digest cadence in use: the person's own, else [notify] digest."
          type: string
          enum:
            - daily
            - weekly
            - off
        digest_set:
          description: true when the person picked the cadence; false when it is the team default.
          type: boolean
        delivery:
          description: apprise_api when the server has SELFHOST_APPRISE_URL, apprise_cli on a laptop with the apprise command, none when nothing can deliver yet.
          type: string
          enum:
            - apprise_api
            - apprise_cli
            - none
    AddNotifyTargetRequest:
      additionalProperties: false
