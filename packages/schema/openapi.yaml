                              - opencode
                              - goose
                              - cursor
                              - copilot
                              - other
                              - unattributed
                          model:
                            description: Model id, or null when not known.
                            anyOf:
                              - type: string
                              - type: "null"
                          lines:
                            minimum: 0
                            type: integer
                          revert_rework_rate:
                            description: Reverted plus reworked over lines, for this agent here. null with no lines to measure, or when only the ledger was read.
                            anyOf:
                              - minimum: 0
                                maximum: 1
                                type: number
                              - type: "null"
                    rank:
                      minimum: 1
                      description: 1 holds the most agent-written lines.
                      type: integer
              vendor_reported:
                description: Lines the vendors' own stats report for the window, when they were given. Shown next to the git numbers, never used in their place.
                type: array
                items:
                  additionalProperties: false
                  title: VendorReportedRow
                  type: object
                  required:
                    - vendor
                    - lines_added
                    - lines_removed
                  properties:
                    vendor:
                      type: string
                      enum:
                        - claude_code
                        - codex
                        - opencode
                        - goose
                        - cursor
                        - copilot
                        - other
                    lines_added:
                      minimum: 0
                      description: What the vendor says its agent added in the window.
                      type: integer
                    lines_removed:
                      minimum: 0
                      type: integer
    TeamProvenanceModules:
      additionalProperties: false
      title: TeamProvenanceModules
      type: object
      required:
        - team
        - from
        - to
        - threshold
        - modules
      properties:
        team:
          pattern: ^[a-z0-9](?:[a-z0-9-]{0,62}[a-z0-9])?$
          description: Team id.
          type: string
        from:
          format: date-time
          type: string
        to:
          format: date-time
          type: string
        threshold:
          minimum: 0
          maximum: 1
          description: "[review] revert_rate_threshold of the team's policy."
          type: number
        modules:
          description: Every module of the team's computed repos, ranked by agent-written lines. Ledger-only repos have none.
          type: array
          items:
            additionalProperties: false
            type: object
            required:
              - repo
              - module
              - lines
              - agent_lines
              - agent_share
              - agent_reverted_lines
              - agent_reworked_lines
              - agent_revert_rework_rate
              - above_threshold
              - by_agent
              - rank
            properties:
              repo:
                description: owner/name.
                type: string
              module:
                minLength: 1
                description: A [review] modules name, else the file's top folder (module_depth deep), or (root).
                type: string
              lines:
                minimum: 0
                description: Lines that landed in the module.
                type: integer
              agent_lines:
                minimum: 0
                description: Those an agent wrote.
                type: integer
              agent_share:
                minimum: 0
                maximum: 1
                description: agent_lines over lines.
                type: number
              agent_reverted_lines:
                description: Agent-written lines reverted within the window. null when only the ledger was read.
                anyOf:
                  - minimum: 0
                    type: integer
                  - type: "null"
              agent_reworked_lines:
                description: Agent-written lines reworked within the window. null when only the ledger was read.
                anyOf:
                  - minimum: 0
                    type: integer
                  - type: "null"
              agent_revert_rework_rate:
                description: agent_reverted_lines plus agent_reworked_lines over agent_lines. null with no lines to measure, or when only the ledger was read.
                anyOf:
                  - minimum: 0
                    maximum: 1
                    type: number
                  - type: "null"
              above_threshold:
                description: true when agent_revert_rework_rate is above [review] revert_rate_threshold with at least min_module_lines agent lines. New pull requests that touch the module score higher risk.
                type: boolean
              by_agent:
                description: Lines by agent and model, most first.
                type: array
                items:
                  additionalProperties: false
                  type: object
                  required:
                    - vendor
                    - model
                    - lines
                    - revert_rework_rate
                  properties:
                    vendor:
                      description: Agent vendor, or unattributed when no signal names one.
                      type: string
                      enum:
                        - claude_code
                        - codex
                        - opencode
                        - goose
                        - cursor
                        - copilot
                        - other
                        - unattributed
                    model:
                      description: Model id, or null when not known.
                      anyOf:
                        - type: string
                        - type: "null"
                    lines:
                      minimum: 0
                      type: integer
                    revert_rework_rate:
                      description: Reverted plus reworked over lines, for this agent here. null with no lines to measure, or when only the ledger was read.
                      anyOf:
                        - minimum: 0
                          maximum: 1
                          type: number
                        - type: "null"
              rank:
                minimum: 1
                description: Across every repo of the team; 1 holds the most agent-written lines.
                type: integer
    RunSummary:
      additionalProperties: false
      title: RunSummary
      type: object
      required:
        - id
        - agent
        - model
        - person
        - team
        - repo
        - started_at
        - ended_at
        - cost_usd
        - tokens
        - cache_hit_rate
        - cache_tip
      properties:
        id:
          description: "Run id: the agent's session id."
          type: string
        agent:
          description: The coding agent, or null when no event named one.
          anyOf:
            - additionalProperties: false
              description: Which coding agent was involved.
              type: object
              required:
                - vendor
              properties:
                vendor:
                  description: Agent product.
                  type: string
                  enum:
                    - claude_code
                    - codex
                    - opencode
                    - goose
                    - cursor
                    - copilot
                    - other
                version:
                  description: Agent CLI or app version, for example 2.1.0.
                  type: string
                name:
                  description: Agent or subagent name when the vendor reports one, for example a Claude Code subagent type.
                  type: string
            - type: "null"
        model:
          description: The model most of the run's requests went to, or null.
          anyOf:
            - type: string
            - type: "null"
        person:
          description: The person the run worked for, or null when not known.
          anyOf:
            - type: string
            - type: "null"
        team:
          description: The team the run belongs to, or null on a laptop ledger.
          anyOf:
            - type: string
            - type: "null"
        repo:
          description: Repository as owner/name, or null when not known.
          anyOf:
            - type: string
            - type: "null"
        started_at:
          format: date-time
          description: The run's first event.
          type: string
        ended_at:
          description: When the session ended, else its last event once it has been idle for 30 minutes. null while it is still going.
          anyOf:
            - format: date-time
              type: string
            - type: "null"
        cost_usd:
          minimum: 0
          description: Spend of the run's model requests, counting one source when several reported the same session.
          type: number
        tokens:
          minimum: 0
          description: Input, output, cache read and cache write tokens of those requests.
          type: integer
        cache_hit_rate:
          description: "Share of the run's input tokens read from the prompt cache, 0 to 1: cache reads over cache reads plus uncached input plus cache writes, counting only sessions that reported a cache read or write. null when the run reported no cache read or write."
          anyOf:
            - minimum: 0
              maximum: 1
              type: number
            - type: "null"
        cache_tip:
          description: One line when the run cost at least [alerts] cache_tip_usd at a hit rate under cache_hit_floor, naming the usual causes; else null.
          anyOf:
            - type: string
            - type: "null"
    RunPullRequest:
      additionalProperties: false
      title: RunPullRequest
      type: object
      required:
        - url
        - state
      properties:
        url:
          format: uri
          description: Pull request URL.
          type: string
        state:
          description: From the newest pr.opened, pr.merged or pr.closed event for it.
          type: string
          enum:
            - open
            - merged
            - closed
        second_opinions:
          description: What the team's AI reviewers said about it, the newest review from each tool. Absent when no reviewer has reviewed it.
          type: array
          items:
            additionalProperties: false
            description: "What the team's AI reviewer said about the pull request: the newest review from one tool."
            type: object
            required:
              - tool
              - reviewer
              - verdict
              - at
              - event_id
            properties:
              tool:
                description: "The reviewer: pr-agent, claude-code-action or coderabbit."
                type: string
                enum:
                  - pr-agent
                  - claude-code-action
                  - coderabbit
              reviewer:
                minLength: 1
                description: GitHub login the review was posted under, such as coderabbitai[bot].
                type: string
              verdict:
                description: approve (nothing to fix), changes (asks for changes before merge), comment (findings without a verdict) or failed (the reviewer's run failed).
                type: string
                enum:
                  - approve
                  - changes
                  - comment
                  - failed
              findings:
                minimum: 0
                description: Findings the reviewer reported, when it says how many. Style nitpicks are not counted.
                type: integer
              severity:
                description: The highest severity among the findings, when the reviewer grades them.
                type: string
                enum:
                  - critical
                  - high
                  - medium
                  - low
              url:
                format: uri
                description: The review, comment or CI run on GitHub.
                type: string
              head_sha:
                pattern: ^[0-9a-f]{7,64}$
                description: The commit that was reviewed.
                type: string
              at:
                format: date-time
                description: When the reviewer posted it.
                type: string
              event_id:
                pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-7[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
                description: The review.submitted ledger event that holds it.
                type: string
