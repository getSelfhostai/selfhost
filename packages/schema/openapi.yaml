# Generated from packages/schema/src. Run `pnpm --filter @selfhost/schema export` after changing the source. Do not edit by hand.
openapi: 3.1.0
info:
  title: selfhost API
  version: "1"
  description: "HTTP API of the selfhost server: ledger ingest and search, the review list, the decision log and team policy. Laptop, self-hosted and hosted installs serve the same API."
  license:
    name: Apache-2.0
    identifier: Apache-2.0
security:
  - bearerAuth: []
paths:
  /v1/health:
    get:
      operationId: getHealth
      summary: Liveness check.
      security: []
      responses:
        "200":
          description: Server is up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /v1/events:
    post:
      operationId: ingestEvents
      summary: Append a batch of ledger events.
      description: "Atomic: if any event is invalid, nothing is written and the response lists every error by index and field. Events in an older schema version are upgraded to the current one before they are stored, for 12 months after the version that replaced it was released (GET /v1/health lists the accepted versions); an unknown or expired version is an error on schema. Event ids are idempotency keys, so retrying a batch is safe. With a person token, events whose actor is a person must carry that person's id (an event with no actor gets it), system actors are refused, and team is set to the person's team."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IngestEventsRequest"
      responses:
        "200":
          description: All events stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestEventsResponse"
        "400":
          description: At least one event is invalid. Nothing was written.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestEventsError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          description: More than 1000 events in one batch.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    get:
      operationId: listEvents
      summary: Search ledger events.
      description: "With a person token, only events written with that team's person tokens: the team filter is the token's team."
      parameters:
        - name: person
          in: query
          required: false
          description: actor.id of a person.
          schema:
            type: string
        - name: agent
          in: query
          required: false
          description: agent.vendor.
          schema:
            type: string
            enum:
              - claude_code
              - codex
              - opencode
              - goose
              - cursor
              - copilot
              - other
        - name: model
          in: query
          required: false
          schema:
            type: string
        - name: session
          in: query
          required: false
          description: session_id.
          schema:
            type: string
        - name: kind
          in: query
          required: false
          schema:
            type: string
            enum:
              - session.started
              - session.ended
              - prompt.submitted
              - tool.called
              - tool.result
              - approval.requested
              - decision.recorded
              - cost.recorded
              - commit.created
              - pr.opened
              - pr.merged
              - pr.closed
              - policy.evaluated
              - alert.raised
              - config.reported
              - review.submitted
              - credential.issued
              - credential.revoked
              - egress.blocked
              - run.triggered
              - run.updated
              - run.output
              - run.health
              - run.gate
              - sandbox.started
              - sandbox.stopped
        - name: team
          in: query
          required: false
          description: "Team id on a team server: events written with that team's person tokens. A person token reads only its own team."
          schema:
            type: string
        - name: from
          in: query
          required: false
          description: Events at or after this time.
          schema:
            format: date-time
            type: string
        - name: to
          in: query
          required: false
          description: Events before this time.
          schema:
            format: date-time
            type: string
        - name: limit
          in: query
          required: false
          description: Maximum number of results.
          schema:
            minimum: 1
            maximum: 1000
            default: 100
            type: integer
        - name: cursor
          in: query
          required: false
          description: Opaque cursor from next_cursor of the previous page.
          schema:
            type: string
      responses:
        "200":
          description: One page of events.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventsPage"
        "400":
          description: Invalid filter.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: A person token asked for another team's events.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/review-items:
    get:
      operationId: listReviewItems
      summary: List review items, ranked.
      description: Blocking items first, then by risk score, then oldest first, then by id; snoozed items after the rest until their snooze ends. With a person token, only items built from that team's events.
      parameters:
        - name: state
          in: query
          required: false
          schema:
            default: open
            type: string
            enum:
              - open
              - answered
              - dismissed
              - expired
        - name: owner
          in: query
          required: false
          description: Only items this person owns.
          schema:
            type: string
        - name: team
          in: query
          required: false
          description: "Team id on a team server: items built from that team's events. A person token reads only its own team."
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Maximum number of results.
          schema:
            minimum: 1
            maximum: 1000
            default: 100
            type: integer
        - name: cursor
          in: query
          required: false
          description: Opaque cursor from next_cursor of the previous page.
          schema:
            type: string
      responses:
        "200":
          description: One page of items.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewItemsPage"
        "400":
          description: Invalid filter.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: A person token asked for another team's items.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/review-items/{id}:
    get:
      operationId: getReviewItem
      summary: Open one review item.
      parameters:
        - name: id
          in: path
          required: true
          description: Review item id.
          schema:
            type: string
      responses:
        "200":
          description: The item.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewItem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No such review item.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/review-items/{id}/decision:
    post:
      operationId: recordDecision
      summary: Answer a review item.
      description: Writes a decision.recorded event, attributed to the person the token belongs to (with the admin token, to by), and closes the item. Every surface reads the same list, so the next read anywhere shows the answer.
      parameters:
        - name: id
          in: path
          required: true
          description: Review item id.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecisionRequest"
      responses:
        "200":
          description: Decision recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DecisionResponse"
        "400":
          description: Invalid decision.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No such review item.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: The item is no longer open. Nothing was written.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewItemConflict"
  /v1/review-items/{id}/snooze:
    post:
      operationId: snoozeReviewItem
      summary: Snooze a review item.
      description: Ranks the item after the rest until the given time. It stays open, and a blocking approval still times out at its deadline.
      parameters:
        - name: id
          in: path
          required: true
          description: Review item id.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SnoozeRequest"
      responses:
        "200":
          description: The snoozed item.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewItem"
        "400":
          description: Invalid snooze.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No such review item.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: The item is no longer open.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewItemConflict"
  /v1/decisions:
    get:
      operationId: listDecisions
      summary: Search human decisions and rule verdicts.
      description: decision.recorded and policy.evaluated events, newest first. path matches a file, the files under a folder and the folders that hold it; topic needs every word in the question or reason. The MCP tool search_decisions makes the same call.
      parameters:
        - name: path
          in: query
          required: false
          description: File or folder path relative to the repository root. Matches decisions on that file, on files under that folder, and on folders that hold it.
          schema:
            minLength: 1
            type: string
        - name: topic
          in: query
          required: false
          description: Words to match in the decision's question and reason. Every word must appear; case is ignored.
          schema:
            minLength: 1
            type: string
        - name: text
          in: query
          required: false
          description: Words to match in the decision reason.
          schema:
            type: string
        - name: rule_id
          in: query
          required: false
          schema:
            type: string
        - name: verdict
          in: query
          required: false
          schema:
            type: string
            enum:
              - allow
              - block
              - ask
              - approve
              - deny
              - answer
              - override
        - name: repo
          in: query
          required: false
          schema:
            type: string
        - name: target
          in: query
          required: false
          description: "Substring of the target value: file path, command or URL."
          schema:
            type: string
        - name: person
          in: query
          required: false
          description: Who decided.
          schema:
            type: string
        - name: team
          in: query
          required: false
          description: "Team id on a team server: decisions and verdicts stored with that team's events. The MCP tool reads every team of the person's by default."
          schema:
            type: string
        - name: item_id
          in: query
          required: false
          schema:
            type: string
        - name: from
          in: query
          required: false
          schema:
            format: date-time
            type: string
        - name: to
          in: query
          required: false
          schema:
            format: date-time
            type: string
        - name: limit
          in: query
          required: false
          description: Maximum number of results.
          schema:
            minimum: 1
            maximum: 1000
            default: 100
            type: integer
        - name: cursor
          in: query
          required: false
          description: Opaque cursor from next_cursor of the previous page.
          schema:
            type: string
        - name: format
          in: query
          required: false
          description: "json (default) or text: the same page as plain text, one block per decision with its id and links."
          schema:
            type: string
            enum:
              - json
              - text
            default: json
      responses:
        "200":
          description: One page of decisions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DecisionsPage"
            text/plain:
              schema:
                type: string
        "400":
          description: Invalid filter.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createDecision
      summary: Record a human decision.
      description: "Every surface records decisions through this call: GitHub reviews and comments on agent pull requests, rule promotions, exception approvals, the CLI inbox, and Slack and Telegram buttons. Writes one decision.recorded event. Decisions are never edited: to correct or overturn one, record a new decision with replaces_event_id. With key and ts, sending the same action again returns the stored decision with duplicate true. Needs the admin token."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDecisionRequest"
      responses:
        "200":
          description: This action was already recorded. Nothing new was written.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateDecisionResponse"
        "201":
          description: Decision recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateDecisionResponse"
        "400":
          description: Invalid decision, or replaces_event_id names no decision. Nothing was written.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/policy:
    get:
      operationId: getPolicy
      summary: Get the team config in use and the rules that apply.
      description: The admin token, or a person token of anyone in the team. The config in use is the org floor, then the team's selfhost.toml, then with repo the repo's own rules; layers says which. With one layer text is that file as it was set.
      parameters:
        - name: person
          in: query
          required: false
          description: Resolve team overrides for this person.
          schema:
            type: string
        - name: agent
          in: query
          required: false
          description: Only rules for this agent.
          schema:
            type: string
            enum:
              - claude_code
              - codex
              - opencode
              - goose
              - cursor
              - copilot
              - other
        - name: team
          in: query
          required: false
          description: Team id on a team server. Needed with the admin token; a person token reads its own team by default, or another team it is in.
          schema:
            type: string
        - name: repo
          in: query
          required: false
          description: "A repo the team owns, as owner/name: the policy with the repo's own rules on top."
          schema:
            pattern: ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$
            type: string
      responses:
        "200":
          description: Policy in use.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyResponse"
        "400":
          description: Invalid query, or no team given with the admin token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The caller is not in the team, or their role there does not allow this. The message names the role needed and the caller's own.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: No such team, the team does not own the repo, or neither the team nor its org has a policy yet.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    put:
      operationId: setPolicy
      summary: Replace a team's selfhost.toml, or the rules of one of its repos.
      description: "The admin token, or a person token whose role in the team is owner or admin. The text is validated first, like selfhost doctor, then against the org floor: a field that would relax an org rule (a lower mode, ask where the org blocks, fewer agents, another match, an allow list that widens, a guardrail the org keeps on) fails and names the org rule in org_rule. Teams and repos can add rules and tighten the org's. An invalid file changes nothing."
      parameters:
        - name: team
          in: query
          required: false
          description: Team id. Needed with the admin token; a person token writes its own team by default, or another team it is in.
          schema:
            type: string
        - name: repo
          in: query
          required: false
          description: "A repo the team owns, as owner/name: set that repo's own rules instead."
          schema:
            type: string
            pattern: ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetPolicyRequest"
      responses:
        "200":
          description: Policy stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyResponse"
        "400":
          description: The selfhost.toml is invalid or relaxes the org floor. Nothing was stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvalidPolicyError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The caller is not in the team, or their role there does not allow this. The message names the role needed and the caller's own.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: No such team, or the team does not own the repo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/context:
    get:
      operationId: getContext
      summary: "Get the team's context layers: the org's and the team's own."
      description: The admin token, or a person token of anyone in the team. The org and team layers of .selfhost/context items (rules, skills, commands, subagents, MCP servers) every member's laptop pulls on sync and merges with the repository's own and the person's, in the order org, team, repo, personal. On a conflict the earlier layer's item is used, so the org's always wins; conflicts lists the team items the org layer replaces. Reading also applies the team's proposals whose review items an owner or admin approved.
      parameters:
        - name: team
          in: query
          required: false
          description: Team id. Needed with the admin token; a person token writes its own team by default, or another team it is in.
          schema:
            type: string
      responses:
        "200":
          description: The layers.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContextResponse"
        "400":
          description: No team given with the admin token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The caller is not in the team, or their role there does not allow this. The message names the role needed and the caller's own.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: No such team.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    put:
      operationId: setContext
      summary: Replace the team's context layer.
      description: The admin token, or a person token whose role in the team is owner or admin. The files are validated like selfhost context compile reads .selfhost/context; an invalid layer changes nothing. Members get the new layer on their next sync.
      parameters:
        - name: team
          in: query
          required: false
          description: Team id. Needed with the admin token; a person token writes its own team by default, or another team it is in.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetContextRequest"
      responses:
        "200":
          description: Stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContextResponse"
        "400":
          description: The files are not a valid context folder. Nothing was stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The caller is not in the team, or their role there does not allow this. The message names the role needed and the caller's own.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: No such team.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/context/proposals:
    post:
      operationId: proposeContextItem
      summary: Propose one of the caller's own context items to the team.
      description: A person token of anyone in the team. Opens a context_promotion review item with the proposal's id. The item is added to the team layer only after an owner or admin of the team approves that review item; a member's answer is refused.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContextProposalRequest"
      responses:
        "201":
          description: Proposed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContextProposal"
        "400":
          description: The files are not valid, or are not exactly the files of the item named.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The admin token, or a team the person is not in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: No such team.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: The org or team layer already has the item.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/policy/coverage:
    get:
      operationId: getPolicyCoverage
      summary: Get what each vendor's native controls cover of the team's rules.
      description: "Compiles the team's selfhost.toml the way selfhost policy compile does and returns the coverage of every rule per vendor: compiled, partial, not_expressible or not_applicable, and whether the selfhost hook covers the rest."
      parameters:
        - name: team
          in: query
          required: false
          description: Team id on a team server. Needed with the admin token; a person token reads its own team by default, or another team it is in.
          schema:
            type: string
        - name: vendor
          in: query
          required: false
          description: Only this vendor's coverage.
          schema:
            type: string
            enum:
              - claude_code
              - codex
              - cursor
              - copilot
      responses:
        "200":
          description: Coverage per rule and vendor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyCoverageResponse"
        "400":
          description: Invalid query, or no team given with the admin token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: A person token asked for another team's policy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: No such team, or the team has no policy yet.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/integrations:
    get:
      operationId: getIntegrations
      summary: The router, tracer, runtime and reviewer the team picked, each checked now.
      description: "The admin token, or a person token of anyone in the team. Reads [integrations] from the policy in use (the org's, then the team's; a team's table for a job replaces the org's) and checks each tool from the server with the cheapest call its docs give: the gateway's health and admin key, the tracer's API key, the runtime's API key, and for a reviewer its workflow file or GitHub App through the selfhost GitHub App. A team with no policy gets every job not_configured. Checks time out after a few seconds each."
      parameters:
        - name: team
          in: query
          required: false
          description: Team id on a team server. Needed with the admin token; a person token uses its own team by default, or another team it is in.
          schema:
            type: string
      responses:
        "200":
          description: Each job's tool and status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntegrationsResponse"
        "400":
          description: Invalid query, or no team given with the admin token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The caller is not in the team, or their role there does not allow this. The message names the role needed and the caller's own.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: No such team.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/integrations/{kind}:
    put:
      operationId: setIntegration
      summary: Pick the tool for one job, writing [integrations.<kind>] in the team's selfhost.toml.
      description: The admin token, or a person token whose role in the team is owner or admin. Replaces the [integrations.<kind>] table of the team's own selfhost.toml with tool and settings (tool null removes it) and leaves the rest of the file as it was, comments included. The new file is validated like PUT /v1/policy, against the org floor too, and an invalid one changes nothing. Answers with the same body as GET /v1/integrations.
      parameters:
        - name: kind
          in: path
          required: true
          description: The job.
          schema:
            type: string
            enum:
              - router
              - tracer
              - runtime
              - reviewer
        - name: team
          in: query
          required: false
          description: Team id. Needed with the admin token; a person token writes its own team by default, or another team it is in.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetIntegrationRequest"
      responses:
        "200":
          description: Stored, with each job checked again.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntegrationsResponse"
        "400":
          description: "The tool is not one for this job, or the settings make selfhost.toml invalid or relax the org floor: an InvalidPolicyError naming each field. An unknown kind or a body that is not JSON answers an ApiError. Nothing was stored."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvalidPolicyError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The caller is not in the team, or their role there does not allow this. The message names the role needed and the caller's own.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: No such team.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: "[integrations.<kind>] is written in a way that cannot be replaced safely, such as an inline table. Change it with PUT /v1/policy."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
