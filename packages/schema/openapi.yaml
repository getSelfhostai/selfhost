          schema:
            type: string
      responses:
        "200":
          description: The org layer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgContextResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: A person token of another org.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: No such org.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    put:
      operationId: setOrgContext
      summary: Replace the org's context layer.
      description: Admin token only. Its items are merged first on every member's laptop, so a team, repo or personal item of the same name is never used in their place.
      parameters:
        - name: org
          in: path
          required: true
          description: Org id.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetContextRequest"
      responses:
        "200":
          description: Stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgContextResponse"
        "400":
          description: The files are not a valid context folder. Nothing was stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Not the admin token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: No such org.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/orgs/{org}/overview:
    get:
      operationId: getOrgOverview
      summary: The cross-team view for the lead.
      description: Every team of the org with the admin token; with a person token, the teams where the person is owner or admin. The org's [budget] is shown to whoever sees every team. Nothing is charged back.
      parameters:
        - name: org
          in: path
          required: true
          description: Org id.
          schema:
            type: string
        - name: from
          in: query
          required: false
          description: "Spend at or after this time. Default: month start."
          schema:
            format: date-time
            type: string
        - name: to
          in: query
          required: false
          description: "Spend before this time. Default: now."
          schema:
            format: date-time
            type: string
      responses:
        "200":
          description: The overview.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgOverview"
        "400":
          description: Invalid time range.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: A person token of another org, or one that leads no team of it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: No such org.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/usage:
    get:
      operationId: getUsage
      summary: Tokens, cost, sessions and pull requests, grouped and filtered.
      description: What the console shows. Every filter applies to every row and to the total, from the ledger's events whatever source wrote them. The admin token sees every team of the org and events with no team; a person token sees the teams of its org it is in. A team filter for a team the caller is not in answers 403.
      parameters:
        - name: group_by
          in: query
          required: false
          description: One or two of team, person, agent, model and day, comma separated, such as person or day,model. Without it, rows holds one row with the total.
          schema:
            pattern: ^(?:team|person|agent|model|day)(?:,(?:team|person|agent|model|day))?$
            type: string
        - name: from
          in: query
          required: false
          description: "Events at or after this time. Default: 30 days before to."
          schema:
            format: date-time
            type: string
        - name: to
          in: query
          required: false
          description: "Events before this time. Default: now."
          schema:
            format: date-time
            type: string
        - name: team
          in: query
          required: false
          description: "Only this team: the team that owns the run's repo, else the team that wrote it. unknown matches events with none."
          schema:
            minLength: 1
            maxLength: 256
            type: string
        - name: person
          in: query
          required: false
          description: Only this person (actor.id of a person). unknown matches events with none.
          schema:
            minLength: 1
            maxLength: 256
            type: string
        - name: agent
          in: query
          required: false
          description: Only this agent (agent.vendor), such as claude_code or codex. unknown matches events with none.
          schema:
            minLength: 1
            maxLength: 256
            type: string
        - name: model
          in: query
          required: false
          description: Only this model, as the vendor reports it. unknown matches events with none.
          schema:
            minLength: 1
            maxLength: 256
            type: string
        - name: org
          in: query
          required: false
          description: "Org whose repos assign runs to teams. Default: the person token's org, or default with the admin token."
          schema:
            pattern: ^[a-z0-9](?:[a-z0-9-]{0,62}[a-z0-9])?$
            type: string
      responses:
        "200":
          description: The rows and the total.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsageResponse"
        "400":
          description: Invalid query or time range.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The caller is not in the team or the org asked for.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/usage.csv:
    get:
      operationId: getUsageCsv
      summary: The same rows as GET /v1/usage, as CSV.
      description: "One line per row of GET /v1/usage for the same query, after a header line: the grouped dimensions, then usd, tokens, input_tokens, output_tokens, cache_read_tokens, cache_write_tokens, cache_hit_rate (empty when unknown), requests, sessions, prs_opened and prs_merged. Text that a spreadsheet would read as a formula starts with an apostrophe."
      parameters:
        - name: group_by
          in: query
          required: false
          description: One or two of team, person, agent, model and day, comma separated, such as person or day,model. Without it, rows holds one row with the total.
          schema:
            pattern: ^(?:team|person|agent|model|day)(?:,(?:team|person|agent|model|day))?$
            type: string
        - name: from
          in: query
          required: false
          description: "Events at or after this time. Default: 30 days before to."
          schema:
            format: date-time
            type: string
        - name: to
          in: query
          required: false
          description: "Events before this time. Default: now."
          schema:
            format: date-time
            type: string
        - name: team
          in: query
          required: false
          description: "Only this team: the team that owns the run's repo, else the team that wrote it. unknown matches events with none."
          schema:
            minLength: 1
            maxLength: 256
            type: string
        - name: person
          in: query
          required: false
          description: Only this person (actor.id of a person). unknown matches events with none.
          schema:
            minLength: 1
            maxLength: 256
            type: string
        - name: agent
          in: query
          required: false
          description: Only this agent (agent.vendor), such as claude_code or codex. unknown matches events with none.
          schema:
            minLength: 1
            maxLength: 256
            type: string
        - name: model
          in: query
          required: false
          description: Only this model, as the vendor reports it. unknown matches events with none.
          schema:
            minLength: 1
            maxLength: 256
            type: string
        - name: org
          in: query
          required: false
          description: "Org whose repos assign runs to teams. Default: the person token's org, or default with the admin token."
          schema:
            pattern: ^[a-z0-9](?:[a-z0-9-]{0,62}[a-z0-9])?$
            type: string
      responses:
        "200":
          description: The rows as CSV.
          content:
            text/csv:
              schema:
                type: string
        "400":
          description: Invalid query or time range.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The caller is not in the team or the org asked for.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/teams/{team}/invites:
    get:
      operationId: listInvites
      summary: List a team's open invites.
      description: "The admin token, or a person token whose role in the team is owner or admin. Invites that still work, newest first: not revoked and not expired. The codes themselves are never stored, so only their ids are listed."
      parameters:
        - name: team
          in: path
          required: true
          description: Team id.
          schema:
            type: string
      responses:
        "200":
          description: The open invites.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamInvitesResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The caller is not in the team, or their role there does not allow this. The message names the role needed and the caller's own.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: No such team.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      operationId: createInvite
      summary: Create another invite code for a team.
      description: The admin token, or a person token whose role in the team is owner or admin. The invite expires after ttl_seconds (default 7 days). With an email, only that person can join with it, and their person id is the email.
      parameters:
        - name: team
          in: path
          required: true
          description: Team id.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInviteRequest"
      responses:
        "201":
          description: Invite created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateInviteResponse"
        "400":
          description: Invalid lifetime or email.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The caller is not in the team, or their role there does not allow this. The message names the role needed and the caller's own.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: No such team.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/invites/{id}:
    delete:
      operationId: revokeInvite
      summary: Revoke an invite code.
      description: The admin token, or a person token whose role in the team is owner or admin. Joining with a revoked invite answers 401. People who already joined keep their tokens. Revoking twice is not an error.
      parameters:
        - name: id
          in: path
          required: true
          description: sha256 of the invite code, in hex.
          schema:
            type: string
      responses:
        "200":
          description: Invite revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invite"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The caller is not in the team, or their role there does not allow this. The message names the role needed and the caller's own.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: No such invite.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/teams/{team}/people/{person}/tokens:
    delete:
      operationId: revokePersonTokens
      summary: Revoke every token a person holds.
      description: The admin token, or a person token whose role in the team is owner or admin. Revoking an owner needs an owner; anyone can revoke their own. The person's events stay in the ledger; their tokens answer 401 from now on. They can join again only with a new invite.
      parameters:
        - name: team
          in: path
          required: true
          description: Team id.
          schema:
            type: string
        - name: person
          in: path
          required: true
          description: Person id.
          schema:
            type: string
      responses:
        "200":
          description: Tokens revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevokeTokensResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The caller is not in the team, or their role there does not allow this. The message names the role needed and the caller's own.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: No such team or person.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/join:
    post:
      operationId: joinTeam
      summary: Exchange an invite code for a person token.
      description: "The invite code is the credential, so no bearer token is needed. A team-wide invite only adds people new to the org: a person id already in any team of the org (compared ignoring case) is refused, so the holder cannot take over the owner's or anyone else's identity, which acts in every team of the org it is in. An invite for an email joins only that person, also when they are already in the team, which adds another token for them."
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JoinRequest"
      responses:
        "200":
          description: Joined.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JoinResponse"
        "400":
          description: Invalid body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Unknown, expired or revoked invite code, or an invite for another person.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/me:
    get:
      operationId: getMe
      summary: Who the bearer token belongs to, their role and what it allows.
      description: "For a person token: the person, their team, their role there, the actions the permission table gives that role (the console offers only these), and every team of the org they are in."
      responses:
        "200":
          description: The token's owner.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/me/token:
    delete:
      operationId: revokeOwnToken
      summary: Revoke the person token that makes this request.
      description: What selfhost team leave calls. Only that token is revoked; the person's other tokens and their events stay.
      responses:
        "200":
          description: Token revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevokeTokensResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The admin token is set on the server and cannot be revoked here.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/notify:
    get:
      operationId: getNotifySettings
      summary: The caller's notification targets, masked, and digest cadence.
      description: "A person token only: each person sets their own notifications. The admin token has none and gets 404. Targets are Apprise URLs; only their service and a masked form are returned, never the URL."
      responses:
        "200":
          description: The settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotifySettings"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/notify/targets:
    post:
      operationId: addNotifyTarget
      summary: Add an Apprise URL the caller's alerts and digests go to.
      description: "A person token only: each person sets their own notifications. The admin token has none and gets 404. The URL is kept on the server and never returned. At most ten targets per person."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddNotifyTargetRequest"
      responses:
        "201":
          description: Added.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotifySettings"
        "400":
          description: Not an Apprise URL, or an invalid name.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: The name is taken, or the caller has ten targets.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/notify/targets/{name}:
    delete:
      operationId: removeNotifyTarget
      summary: Remove one of the caller's targets.
      description: "A person token only: each person sets their own notifications. The admin token has none and gets 404."
      parameters:
        - name: name
          in: path
          required: true
          description: Target name.
          schema:
            type: string
      responses:
        "200":
          description: Removed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotifySettings"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: The caller has no target with this name.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/notify/digest:
    put:
      operationId: setNotifyDigest
      summary: "Set the caller's digest cadence: daily, weekly or off."
      description: "A person token only: each person sets their own notifications. The admin token has none and gets 404. Digests go out at [notify] digest_hour (UTC), weekly ones on Mondays."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetNotifyDigestRequest"
      responses:
        "200":
          description: Set.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotifySettings"
        "400":
          description: Not daily, weekly or off.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/notify/test:
    post:
      operationId: testNotify
      summary: Send a test message to the caller's targets.
      description: "A person token only: each person sets their own notifications. The admin token has none and gets 404. Each send is recorded by target name, ok or failed, with any URL in an error masked."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotifyTestRequest"
      responses:
        "200":
          description: One send per target.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotifyTestResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: The caller has no targets, or none with this name.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: The server has no Apprise to send through (SELFHOST_APPRISE_URL).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/notify/sends:
    get:
      operationId: listNotifySends
      summary: The caller's recent sends, newest first.
      description: "A person token only: each person sets their own notifications. The admin token has none and gets 404. Kept 90 days."
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: The sends.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotifySendsResponse"
        "400":
          description: Invalid limit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          $ref: "#/components/responses/Unauthorized"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: API token from the selfhost server.
  responses:
    Unauthorized:
      description: Missing or invalid bearer token.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
  schemas:
    LedgerEvent:
      $ref: ./json/event.schema.json
    ReviewItem:
      $ref: ./json/review-item.schema.json
    SelfhostConfig:
      $ref: ./json/config.schema.json
    HealthResponse:
      additionalProperties: false
      title: HealthResponse
      type: object
      required:
        - ok
        - version
      properties:
        ok:
          const: true
          type: boolean
        version:
          description: Server version.
          type: string
        event_schemas:
          description: Event schema versions POST /v1/events accepts, newest first. Older ones are upgraded at ingest. Absent on servers older than event schema versioning, which accept selfhost.event/v1 only.
          type: array
          items:
            type: string
    ApiError:
      additionalProperties: false
      title: ApiError
      type: object
      required:
        - error
      properties:
        error:
          additionalProperties: false
          type: object
          required:
            - code
            - message
          properties:
            code:
              description: Stable machine-readable code, for example not_found.
              type: string
            message:
              description: Human-readable message.
              type: string
    IngestEventsRequest:
      additionalProperties: false
      title: IngestEventsRequest
      type: object
      required:
        - events
      properties:
        events:
          minItems: 1
          maxItems: 1000
          type: array
          items:
            $ref: "#/components/schemas/LedgerEvent"
    IngestEventsResponse:
      additionalProperties: false
      title: IngestEventsResponse
      type: object
      required:
        - accepted
        - duplicates
      properties:
        accepted:
          minimum: 0
          description: Events written by this request.
          type: integer
        duplicates:
          minimum: 0
          description: Events skipped because an event with the same id was already stored.
          type: integer
    IngestEventsError:
      additionalProperties: false
      title: IngestEventsError
      type: object
      required:
        - error
        - errors
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              const: invalid_events
              type: string
            message:
              type: string
        errors:
          type: array
          items:
            additionalProperties: false
            type: object
            required:
              - index
              - field
              - message
            properties:
              index:
                minimum: -1
                description: Position of the failing event, or -1 when the batch itself is wrong.
                type: integer
              field:
                description: Field path, for example actor.kind.
                type: string
              message:
                type: string
    EventsPage:
      additionalProperties: false
      title: EventsPage
      type: object
      required:
        - events
        - next_cursor
      properties:
        events:
          description: Newest first.
          type: array
          items:
            $ref: "#/components/schemas/LedgerEvent"
        next_cursor:
          description: Pass as cursor to get the next page. null on the last page.
          anyOf:
            - type: string
            - type: "null"
    ReviewItemsPage:
      additionalProperties: false
      title: ReviewItemsPage
      type: object
      required:
        - items
        - next_cursor
      properties:
        items:
          description: "Ranked: blocking first, then by risk score, then oldest first, then by id. Snoozed items come after the rest until their snooze ends."
          type: array
          items:
            $ref: "#/components/schemas/ReviewItem"
        next_cursor:
          description: Pass as cursor to get the next page. null on the last page.
          anyOf:
            - type: string
            - type: "null"
    DecisionRequest:
      additionalProperties: false
      title: DecisionRequest
      type: object
      required:
        - verdict
      properties:
        verdict:
          type: string
          enum:
            - approve
            - deny
            - answer
            - override
        reason:
          description: Why. For a question, the answer text.
          type: string
        by:
          minLength: 1
          description: Person who decided. Required with the admin token; a person token always decides as its own person.
          type: string
    DecisionResponse:
      additionalProperties: false
      title: DecisionResponse
      type: object
      required:
        - item
        - decision_event
      properties:
        item:
          $ref: "#/components/schemas/ReviewItem"
        decision_event:
          $ref: "#/components/schemas/LedgerEvent"
    SnoozeRequest:
      additionalProperties: false
      title: SnoozeRequest
      type: object
      required:
        - until
      properties:
        until:
          format: date-time
          description: Rank the item after the rest until this time. A time in the past ends a snooze.
          type: string
        by:
          minLength: 1
          description: Person who snoozed. Required with the admin token; a person token always snoozes as its own person.
          type: string
    ReviewItemConflict:
      additionalProperties: false
      title: ReviewItemConflict
      description: "The item is no longer open: someone answered it, it expired or was closed."
      type: object
      required:
        - error
        - item
      properties:
        error:
          additionalProperties: false
          type: object
          required:
            - code
            - message
          properties:
            code:
              const: not_open
              type: string
            message:
              description: Human-readable message.
              type: string
        item:
          $ref: "#/components/schemas/ReviewItem"
    DecisionsPage:
      additionalProperties: false
      title: DecisionsPage
      type: object
      required:
        - decisions
        - next_cursor
      properties:
        decisions:
          description: decision.recorded and policy.evaluated events, newest first.
          type: array
          items:
            $ref: "#/components/schemas/LedgerEvent"
        next_cursor:
          description: Pass as cursor to get the next page. null on the last page.
          anyOf:
            - type: string
            - type: "null"
    CreateDecisionRequest:
      additionalProperties: false
      title: CreateDecisionRequest
      type: object
      required:
        - verdict
        - by
      properties:
        verdict:
          type: string
          enum:
            - approve
            - deny
            - answer
            - override
        by:
          minLength: 1
          description: Person who decided, such as a git email or GitHub login.
          type: string
        name:
          description: Display name of the person.
          type: string
        reason:
          description: Why, in the person's own words. For a question, the answer.
          type: string
        question:
          description: "What was decided, in one line: the review item title, the pull request title or the rule change. Topic search matches it along with the reason."
          type: string
        item_id:
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-7[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
          description: Review item this decision answers.
          type: string
        run_id:
          minLength: 1
          description: Run this decision answers.
          type: string
        rule_id:
          minLength: 1
          description: Rule from selfhost.toml it is about.
          type: string
        repo:
          pattern: ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$
          description: Repository as owner/name.
          type: string
        paths:
          maxItems: 1000
          description: Files or folders the decision is about, relative to the repository root. Path search matches them.
          type: array
          items:
            minLength: 1
            type: string
        pr_url:
          format: uri
          description: Pull request URL.
          type: string
        run_url:
          format: uri
          description: CI run or agent run URL.
          type: string
        commit_sha:
          pattern: ^[0-9a-f]{7,64}$
          description: Git commit SHA.
          type: string
        replaces_event_id:
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-7[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
          description: Decision this one corrects or overturns. The earlier event stays as it was; item, run, rule, question, paths and links not given here are carried over from it.
          type: string
        surface:
          default: api
          description: Where the person decided.
          type: string
          enum:
            - cli
            - rule_promotion
            - exception_approval
            - github_review
            - github_comment
            - slack
            - telegram
            - mcp
            - api
            - timeout
            - auto_approve
        key:
          minLength: 1
          maxLength: 256
          description: "Idempotency key: the surface's own id for this action, such as a GitHub review id or a Slack action id. Sent again with the same ts, it writes nothing new."
          type: string
        ts:
          format: date-time
          description: "When the person decided. Default: now. Required with key."
          type: string
    CreateDecisionResponse:
      additionalProperties: false
      title: CreateDecisionResponse
      type: object
      required:
        - decision_event
        - duplicate
      properties:
        decision_event:
          $ref: "#/components/schemas/LedgerEvent"
        duplicate:
          description: true when this action was already recorded, so nothing new was written.
          type: boolean
    PolicyResponse:
      additionalProperties: false
      title: PolicyResponse
      type: object
      required:
        - hash
        - loaded_at
        - config
        - effective_rules
      properties:
        hash:
          description: sha256 of the selfhost.toml text in use.
          type: string
        team:
          description: Team id, when the policy is a team's.
          type: string
        repo:
          pattern: ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$
          description: The repo, when its own rules are included.
          type: string
        layers:
          description: "What text is made of, in order: the org floor, the team's selfhost.toml, the repo's. With one layer text is that layer's own."
          type: array
          items:
            additionalProperties: false
            type: object
            required:
              - kind
              - name
            properties:
              kind:
                type: string
                enum:
                  - org
                  - team
                  - repo
              name:
                type: string
        text:
          description: The selfhost.toml text in use.
          type: string
        commit_sha:
          description: Git commit of selfhost.toml, when it is read from a repo.
          type: string
        loaded_at:
          format: date-time
          type: string
        config:
          $ref: "#/components/schemas/SelfhostConfig"
        effective_rules:
          description: Rules after team overrides for the given person and agent, with defaults applied. Rules in mode off are left out.
          type: array
          items:
            additionalProperties: false
            description: "One rule: what it matches, what it does and whether it is enforced yet."
            type: object
            required:
              - id
              - match
              - action
              - message
            properties:
              id:
                pattern: ^[A-Za-z0-9][A-Za-z0-9_.-]*$
                description: Stable rule id, recorded on every decision the rule makes.
                type: string
              description:
                description: What the rule is for.
                type: string
              mode:
                description: observe records what the rule would have done, enforce applies it, off disables it.
                default: observe
                type: string
                enum:
                  - observe
                  - enforce
                  - off
              agents:
                minItems: 1
                description: Agents the rule applies to. "all" matches every agent.
                default:
                  - all
                type: array
                items:
                  description: An agent, or all.
                  type: string
                  enum:
                    - all
                    - claude_code
                    - codex
                    - opencode
                    - goose
                    - cursor
                    - copilot
                    - other
              match:
                additionalProperties: false
                minProperties: 1
                description: What the rule matches. Every field given must match.
                type: object
                properties:
                  tool:
                    minLength: 1
                    description: Exact tool name, for example Bash, Edit or an MCP tool name.
                    type: string
                  command:
                    minLength: 1
                    description: Regular expression tested against shell commands.
                    type: string
                  path:
                    minLength: 1
                    description: Glob tested against file paths relative to the repository root.
                    type: string
                  url:
                    minLength: 1
                    description: Glob tested against URLs the agent requests.
                    type: string
              action:
                description: block stops the action, ask sends it to a person.
                type: string
                enum:
                  - block
                  - ask
              message:
                minLength: 1
                description: Shown to the agent and the person when the rule fires.
                type: string
              alternative:
                minLength: 1
                description: What the agent should do instead, shown with the message when the rule blocks or asks, for example "Open a pull request instead."
                type: string
              docs:
                format: uri
                description: Page that explains the rule, linked from every block and ask.
                type: string
              irreversible:
                default: false
                description: true when the matched action cannot be undone, which raises review risk.
                type: boolean
    PolicyCoverageResponse:
      additionalProperties: false
      title: PolicyCoverageResponse
      description: "What selfhost policy compile would write for the team's selfhost.toml: per rule and vendor, whether the vendor's native controls express it and whether the selfhost hook covers the rest."
      type: object
      required:
        - hash
        - team
        - coverage
      properties:
        hash:
          description: sha256 of the selfhost.toml text compiled.
          type: string
        team:
          description: Team id.
          type: string
        coverage:
          additionalProperties: false
          title: PolicyCoverage
          type: object
          required:
            - schema
            - team
            - vendors
            - rules
          properties:
            schema:
              const: selfhost.policy_coverage/v1
              type: string
            team:
              description: Team whose overrides were applied, or null.
              anyOf:
                - type: string
                - type: "null"
            vendors:
              type: array
              items:
                additionalProperties: false
                title: VendorCoverage
                type: object
                required:
                  - vendor
                  - version
                  - docs
                  - notes
                properties:
                  vendor:
                    type: string
                    enum:
                      - claude_code
                      - codex
                      - cursor
                      - copilot
                  version:
                    description: Vendor config version the output targets.
                    type: string
                  docs:
                    description: Vendor docs the mapping follows.
                    type: array
                    items:
                      type: string
                  notes:
                    description: Side effects and checks still open for this vendor.
                    type: array
                    items:
                      type: string
            rules:
              description: "One entry per rule and vendor, in rule order then vendor order: rules in file order, then mcp.allow, models.allow and egress.allow."
              type: array
              items:
                additionalProperties: false
                title: RuleCoverage
                type: object
                required:
                  - rule_id
                  - vendor
                  - mode
                  - action
                  - status
                  - native
                  - hook
                  - detail
                properties:
                  rule_id:
                    description: Rule id, or mcp.allow, models.allow and egress.allow.
                    type: string
                  vendor:
                    type: string
                    enum:
                      - claude_code
                      - codex
                      - cursor
                      - copilot
                  mode:
                    description: Mode after the team's overrides.
                    type: string
                    enum:
                      - observe
                      - enforce
                      - off
                  action:
                    type: string
                    enum:
                      - block
                      - ask
                  status:
                    description: What the vendor's native controls express once the rule is enforced. Observe rules write nothing native.
                    type: string
                    enum:
                      - compiled
                      - partial
                      - not_expressible
                      - not_applicable
                  native:
                    description: Native entries written for the rule, like Bash(git push --force*). Empty when nothing is written.
                    type: array
                    items:
                      type: string
                  hook:
                    description: What the selfhost pre-tool hook does for the rule on this vendor.
                    type: string
                    enum:
                      - enforce
                      - record
                      - none
                  detail:
                    description: Why, and what is left uncovered.
                    type: string
