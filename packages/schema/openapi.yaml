  /v1/runs/{run_id}:
    get:
      operationId: getRun
      summary: One agent run for the console's run view, with links to it in the team's tracer.
      description: "The admin token, or a person token of anyone in the team. A run is one agent session: run_id is the session_id its events carry, and it belongs to the team most of its events were written to. The answer has the run's summary, its ledger events oldest first (limit and cursor page through them), the pull requests they link to and trace_url, the run in the team's tracer from [integrations.tracer] run_url once the server has sent it there. Events are redacted under the team's current [ledger] and [[redaction]] settings. The full trace lives in the tracer; this is the summary and the way out to it."
      parameters:
        - name: run_id
          in: path
          required: true
          description: "Run id: the agent's session id."
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Maximum number of events.
          schema:
            minimum: 1
            maximum: 1000
            default: 200
            type: integer
        - name: cursor
          in: query
          required: false
          description: Opaque cursor from next_cursor of the previous page.
          schema:
            type: string
      responses:
        "200":
          description: The run.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunResponse"
        "400":
          description: Invalid limit or cursor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: A person token whose teams do not include the run's team. The same answer whether or not the run exists, so it shows nothing of it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: No such run (admin token).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/background-runs:
    post:
      operationId: startBackgroundRun
      summary: "Start a background run: an agent CLI in a sandbox on the team's runtime."
      description: "A person token only, with the work role in the team: the run works for that person and under their own agent login. The trigger is checked ([background] allowed, kill switches, rate_limit_per_hour, max_concurrent, a runtime) and recorded as a run.triggered event either way. The run goes on in the background: a sandbox, a clone on its own branch, the agent CLI and the team's hooks, the tests-first gate, one pull request. Read it back with GET /v1/background-runs/{id}."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartRunRequest"
      responses:
        "202":
          description: Started; the run as queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackgroundRun"
        "400":
          description: Invalid body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The admin token, a caller without the work role, or a person not on [background] allowed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: A team or org kill switch is on.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: The team's hourly or concurrent run limit is reached.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: No runtime is set up for the team, or background runs are off.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    get:
      operationId: listBackgroundRuns
      summary: Background runs, newest first, with the kill switches in force.
      description: The admin token, or a person token of anyone in the team. A person token sees the runs of every team of its org it is in.
      parameters:
        - name: team
          in: query
          required: false
          schema:
            minLength: 1
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
            enum:
              - active
              - final
              - queued
              - starting
              - running
              - testing
              - pushing
              - succeeded
              - failed
              - cancelled
              - timed_out
              - stuck
        - name: limit
          in: query
          required: false
          schema:
            minimum: 1
            maximum: 200
            default: 50
            type: integer
      responses:
        "200":
          description: The runs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackgroundRunsResponse"
        "400":
          description: Invalid query.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The caller is not in the team, or their role there does not allow this. The message names the role needed and the caller's own.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/background-runs/{id}:
    get:
      operationId: getBackgroundRun
      summary: "One background run: state, health line, live cost, gate and pull request."
      description: The admin token, or a person token of anyone in the team. cost rises while the run goes; once it is final it equals the cost on its last run.updated event.
      parameters:
        - name: id
          in: path
          required: true
          description: Run id.
          schema:
            type: string
      responses:
        "200":
          description: The run.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackgroundRun"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: No run the caller can read has this id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: No such run (admin token).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/background-runs/{id}/cancel:
    post:
      operationId: cancelBackgroundRun
      summary: Stop one run and its sandbox.
      description: The admin token, or a person token with the work role in the run's team. Who stopped it is recorded on the run. A final run is answered as it is.
      parameters:
        - name: id
          in: path
          required: true
          description: Run id.
          schema:
            type: string
      responses:
        "200":
          description: The run.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackgroundRun"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The caller is not in the team, or their role there does not allow this. The message names the role needed and the caller's own.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: No such run.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/background-runs/kill:
    post:
      operationId: killBackgroundRuns
      summary: "Turn a team or org kill switch on: stop every run in it, refuse new ones."
      description: A team switch needs the admin token or an owner or admin of the team; an org switch the admin token or an owner in the org. Who used it is kept.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KillRequest"
      responses:
        "200":
          description: The switch, and the runs stopped.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KillResponse"
        "400":
          description: Invalid body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The caller is not in the team, or their role there does not allow this. The message names the role needed and the caller's own.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Background runs are off.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: clearBackgroundKill
      summary: Turn a kill switch off, so runs may start again.
      description: The same callers as turning it on. Who cleared it is kept.
      parameters:
        - name: scope
          in: query
          required: true
          schema:
            type: string
            enum:
              - team
              - org
        - name: target
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The switch.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KillResponse"
        "400":
          description: Invalid query.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The caller is not in the team, or their role there does not allow this. The message names the role needed and the caller's own.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Background runs are off.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/background-runs/webhook:
    post:
      operationId: webhookBackgroundRun
      summary: Start a run from a signed webhook (the Slack and Telegram bridges use it).
      description: "No bearer token: X-Selfhost-Signature-256, sha256= and the HMAC-SHA256 of the body in hex under the secret in the server variable [background] webhook_secret_env names, is the credential. A missing or wrong signature starts nothing and is recorded as a refused run.triggered event. sender is the person the bridge mapped the message to; the same checks as POST /v1/background-runs apply."
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookRunRequest"
      responses:
        "202":
          description: Started.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackgroundRun"
        "400":
          description: Invalid body, or no team.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: The signature does not match, or webhooks are off for the team.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: The sender may not start runs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Background runs are off on this server.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: A kill switch is on.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: A run limit is reached.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: No runtime is set up for the team.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/events/tail:
    get:
      operationId: tailEvents
      summary: The events that reached the ledger since the last call, for selfhost tail.
      description: "The admin token, or a person token of anyone in the team. A long poll in ingest order: pass the cursor of the previous answer as after, and wait to hold the request until something lands. The admin token reads every team and events with no team; a person token reads the teams of its org it is in. Events are redacted under each team's current [ledger] and [[redaction]] settings, as GET /v1/runs/{run_id} shows them, so prompt text appears only while log_prompts is on."
      parameters:
        - name: after
          in: query
          required: false
          description: "cursor of the previous answer: only events that reached the ledger after those. Without it the answer has no events and the cursor of now, unless since is given."
          schema:
            minLength: 1
            maxLength: 200
            type: string
        - name: since
          in: query
          required: false
          description: "Events that happened at or after this time. Without after, the first answer starts with them. Default: 24 hours before now."
          schema:
            format: date-time
            type: string
        - name: kind
          in: query
          required: false
          description: Comma-separated event kinds, or their first part (tool for tool.called and tool.result).
          schema:
            pattern: ^(?:session\.started|session\.ended|prompt\.submitted|tool\.called|tool\.result|approval\.requested|decision\.recorded|cost\.recorded|commit\.created|pr\.opened|pr\.merged|pr\.closed|policy\.evaluated|alert\.raised|config\.reported|review\.submitted|credential\.issued|credential\.revoked|egress\.blocked|run\.triggered|run\.updated|run\.output|run\.health|run\.gate|sandbox\.started|sandbox\.stopped|session|prompt|tool|approval|decision|cost|commit|pr|policy|alert|config|review|credential|egress|run|sandbox)(?:,(?:session\.started|session\.ended|prompt\.submitted|tool\.called|tool\.result|approval\.requested|decision\.recorded|cost\.recorded|commit\.created|pr\.opened|pr\.merged|pr\.closed|policy\.evaluated|alert\.raised|config\.reported|review\.submitted|credential\.issued|credential\.revoked|egress\.blocked|run\.triggered|run\.updated|run\.output|run\.health|run\.gate|sandbox\.started|sandbox\.stopped|session|prompt|tool|approval|decision|cost|commit|pr|policy|alert|config|review|credential|egress|run|sandbox))*$
            type: string
        - name: person
          in: query
          required: false
          description: "A person: events they acted in, sent (data.sent_by), or that belong to one of their sessions, such as rule decisions and tool calls read from logs."
          schema:
            minLength: 1
            type: string
        - name: agent
          in: query
          required: false
          description: agent.vendor.
          schema:
            type: string
            enum:
              - claude_code
              - codex
              - opencode
              - goose
              - cursor
              - copilot
              - other
        - name: repo
          in: query
          required: false
          description: "owner/name: the event's repo, else its run's repo."
          schema:
            pattern: ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$
            type: string
        - name: session
          in: query
          required: false
          description: session_id.
          schema:
            minLength: 1
            type: string
        - name: run
          in: query
          required: false
          description: "run_id: one background run's events."
          schema:
            minLength: 1
            type: string
        - name: team
          in: query
          required: false
          description: Only this team's events. A person token reads the teams of its org it is in, all of them by default.
          schema:
            minLength: 1
            type: string
        - name: wait
          in: query
          required: false
          description: Seconds to hold the request open while there is nothing new.
          schema:
            minimum: 0
            maximum: 30
            default: 0
            type: integer
        - name: limit
          in: query
          required: false
          schema:
            minimum: 1
            maximum: 1000
            default: 200
            type: integer
      responses:
        "200":
          description: What landed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TailResponse"
        "400":
          description: Invalid query or cursor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The caller is not in the team, or their role there does not allow this. The message names the role needed and the caller's own.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/budget:
    get:
      operationId: getBudget
      summary: Spend so far against a team's budget, with a forecast.
      description: The admin token, or a person token of anyone in the team. The budget is [budget] in the team's selfhost.toml. Nothing is charged back; with [budget] mode = hard the AI gateway also refuses requests once it is spent (GET /v1/gateway shows its limits). The MCP tool get_budget makes the same call.
      parameters:
        - name: person
          in: query
          required: false
          description: Only this person's spend in the team. limit_usd is then null.
          schema:
            type: string
        - name: team
          in: query
          required: false
          description: Team id. Needed with the admin token; a person token reads its own team by default, or another team it is in.
          schema:
            type: string
        - name: period
          in: query
          required: false
          description: The UTC day, the week from Monday, or the calendar month, now.
          schema:
            default: month
            type: string
            enum:
              - day
              - week
              - month
      responses:
        "200":
          description: The budget.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BudgetResponse"
        "400":
          description: Invalid query, or no team given with the admin token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The caller is not in the team, or their role there does not allow this. The message names the role needed and the caller's own.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: No such team.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/gateway:
    get:
      operationId: getGateway
      summary: "The AI gateway: health, the team's hard limits and the caller's own key."
      description: The admin token, or a person token of anyone in the team. The gateway (Bifrost or LiteLLM, [integrations.router]) holds the provider keys and enforces the limits; selfhost sets them from [budget] and reads its request logs into the ledger. Key values are never returned here.
      parameters:
        - name: team
          in: query
          required: false
          description: Team id. Needed with the admin token; a person token writes its own team by default, or another team it is in.
          schema:
            type: string
      responses:
        "200":
          description: The gateway.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayStatus"
        "400":
          description: No team given with the admin token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The caller is not in the team, or their role there does not allow this. The message names the role needed and the caller's own.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: No gateway is configured on this server.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/gateway/keys:
    get:
      operationId: listGatewayKeys
