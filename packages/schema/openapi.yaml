      type: object
      required:
        - url
      properties:
        url:
          minLength: 1
          maxLength: 2048
          description: An Apprise URL, such as tgram://<bot token>/<chat id>, mailtos://..., slack://... or ntfys://<topic>. Stored on the server only.
          type: string
        name:
          pattern: ^[A-Za-z0-9][A-Za-z0-9._-]{0,39}$
          description: "Default: the URL's service, such as tgram, numbered when it is taken."
          type: string
    SetNotifyDigestRequest:
      additionalProperties: false
