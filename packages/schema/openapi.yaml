          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvalidPolicyError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Not the admin token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
