          minimum: 0
          description: Merged pull requests and direct commits that brought at least one line.
          type: integer
        runs:
          minimum: 0
          description: Agent sessions in the ledger behind the lines.
          type: integer
        reverted_lines:
          description: "Lines taken out within the window by a revert: a commit that says it reverts the change, or one that removes every line of it that was left and adds back no more than a tenth as many. null when only the ledger was read."
          anyOf:
            - minimum: 0
              type: integer
            - type: "null"
        reworked_lines:
          description: Lines changed or deleted within the window by any other later commit. Fix-forward edits count here. null when only the ledger was read.
          anyOf:
            - minimum: 0
              type: integer
            - type: "null"
        open_lines:
          description: Lines merged less than the window ago, so their count can still grow. null when only the ledger was read.
          anyOf:
            - minimum: 0
              type: integer
            - type: "null"
        revert_rate:
          description: reverted_lines over lines. null with no lines to measure, or when only the ledger was read.
          anyOf:
            - minimum: 0
              maximum: 1
              type: number
            - type: "null"
        rework_rate:
          description: reworked_lines over lines. null with no lines to measure, or when only the ledger was read.
          anyOf:
            - minimum: 0
              maximum: 1
