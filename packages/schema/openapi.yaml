            input_tokens:
              minimum: 0
              description: Uncached input tokens.
              type: integer
            output_tokens:
              minimum: 0
              description: Output tokens, including reasoning tokens.
              type: integer
            cache_read_tokens:
              minimum: 0
              description: Input tokens read from the prompt cache.
              type: integer
            cache_write_tokens:
              minimum: 0
              description: Input tokens written to the prompt cache.
              type: integer
            requests:
              minimum: 0
              description: cost.recorded events, one per model request.
              type: integer
            sessions:
              minimum: 0
              description: Distinct agent sessions (agent and session_id) with a session, prompt or cost event in the range.
              type: integer
            prs_opened:
              minimum: 0
