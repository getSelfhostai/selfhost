      description: "The admin token, or a person token of anyone in the team. Computed on read. For a repo the server has a clone of (SELFHOST_GIT_CLONES, as <owner>/<name>), every non-blank line merged to the main branch in the range is traced with git blame to the commit that wrote it, joined to the agent run the ledger recorded for that commit (else the commit's own attribution, else its merged pull request), and followed for [review] revert_window_days: lines a later commit changed or deleted are reworked (fix-forward edits count), lines a revert took out are reverted. A repo with no clone is ledger_only: lines from its pr.merged events, no modules, no rates. Modules and the threshold come from [review] in the team's policy."
      parameters:
        - name: team
          in: path
          required: true
          description: Team id.
          schema:
            type: string
        - name: from
          in: query
          required: false
          description: "Merges at or after this time. Default: 30 days before to."
          schema:
            format: date-time
            type: string
        - name: to
