# Generated from packages/schema/src. Run `pnpm --filter @selfhost/schema export` after changing the source. Do not edit by hand.
openapi: 3.1.0
info:
  title: selfhost API
  version: "1"
  description: "HTTP API of the selfhost server: ledger ingest and search, the review list, the decision log and team policy. Laptop, self-hosted and hosted installs serve the same API."
  license:
    name: Apache-2.0
    identifier: Apache-2.0
security:
  - bearerAuth: []
paths:
  /v1/health:
    get:
      operationId: getHealth
      summary: Liveness check.
      security: []
      responses:
        "200":
          description: Server is up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /v1/events:
    post:
      operationId: ingestEvents
      summary: Append a batch of ledger events.
      description: "Atomic: if any event is invalid, nothing is written and the response lists every error by index and field. Event ids are idempotency keys, so retrying a batch is safe. With a person token, events whose actor is a person must carry that person's id (an event with no actor gets it), system actors are refused, and team is set to the person's team."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IngestEventsRequest"
      responses:
        "200":
          description: All events stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestEventsResponse"
        "400":
          description: At least one event is invalid. Nothing was written.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestEventsError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          description: More than 1000 events in one batch.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    get:
      operationId: listEvents
      summary: Search ledger events.
      description: "With a person token, only events written with that team's person tokens: the team filter is the token's team."
      parameters:
        - name: person
          in: query
          required: false
          description: actor.id of a person.
          schema:
            type: string
        - name: agent
          in: query
          required: false
          description: agent.vendor.
          schema:
            type: string
            enum:
              - claude_code
              - codex
              - opencode
              - goose
              - cursor
              - copilot
              - other
        - name: model
          in: query
          required: false
          schema:
            type: string
        - name: session
          in: query
          required: false
          description: session_id.
          schema:
            type: string
        - name: kind
          in: query
          required: false
          schema:
            type: string
            enum:
              - session.started
              - session.ended
              - prompt.submitted
              - tool.called
              - tool.result
              - approval.requested
              - decision.recorded
              - cost.recorded
              - commit.created
              - pr.opened
              - pr.merged
              - pr.closed
              - policy.evaluated
              - alert.raised
        - name: team
          in: query
          required: false
          description: "Team id on a team server: events written with that team's person tokens. A person token reads only its own team."
          schema:
            type: string
        - name: from
          in: query
          required: false
          description: Events at or after this time.
          schema:
            format: date-time
            type: string
        - name: to
          in: query
          required: false
          description: Events before this time.
          schema:
            format: date-time
            type: string
        - name: limit
          in: query
          required: false
          description: Maximum number of results.
          schema:
            minimum: 1
            maximum: 1000
            default: 100
            type: integer
        - name: cursor
          in: query
          required: false
          description: Opaque cursor from next_cursor of the previous page.
          schema:
            type: string
      responses:
        "200":
          description: One page of events.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventsPage"
        "400":
          description: Invalid filter.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: A person token asked for another team's events.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/review-items:
    get:
      operationId: listReviewItems
      summary: List review items, ranked.
      description: Blocking items first, then by risk score, then oldest first, then by id; snoozed items after the rest until their snooze ends. With a person token, only items built from that team's events.
      parameters:
        - name: state
          in: query
          required: false
          schema:
            default: open
            type: string
            enum:
              - open
              - answered
              - dismissed
              - expired
        - name: owner
          in: query
          required: false
          description: Only items this person owns.
          schema:
            type: string
        - name: team
          in: query
          required: false
          description: "Team id on a team server: items built from that team's events. A person token reads only its own team."
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Maximum number of results.
          schema:
            minimum: 1
            maximum: 1000
            default: 100
            type: integer
        - name: cursor
          in: query
          required: false
          description: Opaque cursor from next_cursor of the previous page.
          schema:
            type: string
      responses:
        "200":
          description: One page of items.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewItemsPage"
        "400":
          description: Invalid filter.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: A person token asked for another team's items.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/review-items/{id}:
    get:
      operationId: getReviewItem
      summary: Open one review item.
      parameters:
        - name: id
          in: path
          required: true
          description: Review item id.
          schema:
            type: string
      responses:
        "200":
          description: The item.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewItem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No such review item.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/review-items/{id}/decision:
    post:
      operationId: recordDecision
      summary: Answer a review item.
      description: Writes a decision.recorded event, attributed to the person the token belongs to (with the admin token, to by), and closes the item. Every surface reads the same list, so the next read anywhere shows the answer.
      parameters:
        - name: id
          in: path
          required: true
          description: Review item id.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecisionRequest"
      responses:
        "200":
          description: Decision recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DecisionResponse"
        "400":
          description: Invalid decision.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No such review item.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: The item is no longer open. Nothing was written.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewItemConflict"
  /v1/review-items/{id}/snooze:
    post:
      operationId: snoozeReviewItem
      summary: Snooze a review item.
      description: Ranks the item after the rest until the given time. It stays open, and a blocking approval still times out at its deadline.
      parameters:
        - name: id
          in: path
          required: true
          description: Review item id.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SnoozeRequest"
      responses:
        "200":
          description: The snoozed item.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewItem"
        "400":
          description: Invalid snooze.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No such review item.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: The item is no longer open.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewItemConflict"
  /v1/decisions:
    get:
      operationId: listDecisions
      summary: Search human decisions and rule verdicts.
      description: decision.recorded and policy.evaluated events, newest first. path matches a file, the files under a folder and the folders that hold it; topic needs every word in the question or reason. The MCP tool search_decisions makes the same call.
      parameters:
        - name: path
          in: query
          required: false
          description: File or folder path relative to the repository root. Matches decisions on that file, on files under that folder, and on folders that hold it.
          schema:
            minLength: 1
            type: string
        - name: topic
          in: query
          required: false
          description: Words to match in the decision's question and reason. Every word must appear; case is ignored.
          schema:
            minLength: 1
            type: string
        - name: text
          in: query
          required: false
          description: Words to match in the decision reason.
          schema:
            type: string
        - name: rule_id
          in: query
          required: false
          schema:
            type: string
        - name: verdict
          in: query
          required: false
          schema:
            type: string
            enum:
              - allow
              - block
              - ask
              - approve
              - deny
              - answer
              - override
        - name: repo
          in: query
          required: false
          schema:
            type: string
        - name: target
          in: query
          required: false
          description: "Substring of the target value: file path, command or URL."
          schema:
            type: string
        - name: person
          in: query
          required: false
          description: Who decided.
          schema:
            type: string
        - name: item_id
          in: query
          required: false
          schema:
            type: string
        - name: from
          in: query
          required: false
          schema:
            format: date-time
            type: string
        - name: to
          in: query
          required: false
          schema:
            format: date-time
            type: string
        - name: limit
          in: query
          required: false
          description: Maximum number of results.
          schema:
            minimum: 1
            maximum: 1000
            default: 100
            type: integer
        - name: cursor
          in: query
          required: false
          description: Opaque cursor from next_cursor of the previous page.
          schema:
            type: string
        - name: format
          in: query
          required: false
          description: "json (default) or text: the same page as plain text, one block per decision with its id and links."
          schema:
            type: string
            enum:
              - json
              - text
            default: json
      responses:
        "200":
          description: One page of decisions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DecisionsPage"
            text/plain:
              schema:
                type: string
        "400":
          description: Invalid filter.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createDecision
      summary: Record a human decision.
      description: "Every surface records decisions through this call: GitHub reviews and comments on agent pull requests, rule promotions, exception approvals, the CLI inbox, and Slack and Telegram buttons. Writes one decision.recorded event. Decisions are never edited: to correct or overturn one, record a new decision with replaces_event_id. With key and ts, sending the same action again returns the stored decision with duplicate true. Needs the admin token."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDecisionRequest"
      responses:
        "200":
          description: This action was already recorded. Nothing new was written.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateDecisionResponse"
        "201":
          description: Decision recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateDecisionResponse"
        "400":
          description: Invalid decision, or replaces_event_id names no decision. Nothing was written.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/policy:
    get:
      operationId: getPolicy
      summary: Get the team config in use and the rules that apply.
      parameters:
        - name: person
          in: query
          required: false
          description: Resolve team overrides for this person.
          schema:
            type: string
        - name: agent
          in: query
          required: false
          description: Only rules for this agent.
          schema:
            type: string
            enum:
              - claude_code
              - codex
              - opencode
              - goose
              - cursor
              - copilot
              - other
        - name: team
          in: query
          required: false
          description: Team id on a team server. Needed with the admin token; a person token reads its own team.
          schema:
            type: string
      responses:
        "200":
          description: Policy in use.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyResponse"
        "400":
          description: Invalid query, or no team given with the admin token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: A person token asked for another team's policy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: No such team, or the team has no policy yet.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    put:
      operationId: setPolicy
      summary: Replace a team's selfhost.toml.
      description: Admin token, or a person token whose role is owner or admin. The text is validated first; an invalid file changes nothing.
      parameters:
        - name: team
          in: query
          required: false
          description: Team id. Needed with the admin token; a person token writes its own team.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetPolicyRequest"
      responses:
        "200":
          description: Policy stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyResponse"
        "400":
          description: The selfhost.toml is invalid. Nothing was stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvalidPolicyError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The person token's role is not owner or admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: No such team.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/policy/coverage:
    get:
      operationId: getPolicyCoverage
      summary: Get what each vendor's native controls cover of the team's rules.
      description: "Compiles the team's selfhost.toml the way selfhost policy compile does and returns the coverage of every rule per vendor: compiled, partial, not_expressible or not_applicable, and whether the selfhost hook covers the rest."
      parameters:
        - name: team
          in: query
          required: false
          description: Team id on a team server. Needed with the admin token; a person token reads its own team.
          schema:
            type: string
        - name: vendor
          in: query
          required: false
          description: Only this vendor's coverage.
          schema:
            type: string
            enum:
              - claude_code
              - codex
              - cursor
              - copilot
      responses:
        "200":
          description: Coverage per rule and vendor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyCoverageResponse"
        "400":
          description: Invalid query, or no team given with the admin token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: A person token asked for another team's policy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: No such team, or the team has no policy yet.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/teams:
    post:
      operationId: createTeam
      summary: Create a team and its invite code.
      description: Admin token only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTeamRequest"
      responses:
        "201":
          description: Team created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateTeamResponse"
        "400":
          description: Invalid name or invite lifetime.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: A team with this id already exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/teams/{team}/invites:
    post:
      operationId: createInvite
      summary: Create another invite code for a team.
      description: Admin token only. The invite expires after ttl_seconds (default 7 days). With an email, only that person can join with it, and their person id is the email.
      parameters:
        - name: team
          in: path
          required: true
          description: Team id.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInviteRequest"
      responses:
        "201":
          description: Invite created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateInviteResponse"
        "400":
          description: Invalid lifetime or email.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No such team.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/invites/{id}:
    delete:
      operationId: revokeInvite
      summary: Revoke an invite code.
      description: Admin token only. Joining with a revoked invite answers 401. People who already joined keep their tokens. Revoking twice is not an error.
      parameters:
        - name: id
          in: path
          required: true
          description: sha256 of the invite code, in hex.
          schema:
            type: string
      responses:
        "200":
          description: Invite revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invite"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No such invite.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/teams/{team}/people/{person}/tokens:
    delete:
      operationId: revokePersonTokens
      summary: Revoke every token a person holds.
      description: Admin token only. The person's events stay in the ledger; their tokens answer 401 from now on. They can join again only with a new invite.
      parameters:
        - name: team
          in: path
          required: true
          description: Team id.
          schema:
            type: string
        - name: person
          in: path
          required: true
          description: Person id.
          schema:
            type: string
      responses:
        "200":
          description: Tokens revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevokeTokensResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No such team or person.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/join:
    post:
      operationId: joinTeam
      summary: Exchange an invite code for a person token.
      description: "The invite code is the credential, so no bearer token is needed. A team-wide invite only adds new people: a person id already in the team (compared ignoring case) is refused, so the holder cannot take over the owner's or anyone else's identity. An invite for an email joins only that person, also when they are already in the team, which adds another token for them."
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JoinRequest"
      responses:
        "200":
          description: Joined.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JoinResponse"
        "400":
          description: Invalid body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Unknown, expired or revoked invite code, or an invite for another person.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/me:
    get:
      operationId: getMe
      summary: Who the bearer token belongs to.
      responses:
        "200":
          description: The token's owner.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/me/token:
    delete:
      operationId: revokeOwnToken
      summary: Revoke the person token that makes this request.
      description: What selfhost team leave calls. Only that token is revoked; the person's other tokens and their events stay.
      responses:
        "200":
          description: Token revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevokeTokensResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The admin token is set on the server and cannot be revoked here.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: API token from the selfhost server.
  responses:
    Unauthorized:
      description: Missing or invalid bearer token.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
  schemas:
    LedgerEvent:
      $ref: ./json/event.schema.json
    ReviewItem:
      $ref: ./json/review-item.schema.json
    SelfhostConfig:
      $ref: ./json/config.schema.json
    HealthResponse:
      additionalProperties: false
      title: HealthResponse
      type: object
      required:
        - ok
        - version
      properties:
        ok:
          const: true
          type: boolean
        version:
          description: Server version.
          type: string
    ApiError:
      additionalProperties: false
      title: ApiError
      type: object
      required:
        - error
      properties:
        error:
          additionalProperties: false
          type: object
          required:
            - code
            - message
          properties:
            code:
              description: Stable machine-readable code, for example not_found.
              type: string
            message:
              description: Human-readable message.
              type: string
    IngestEventsRequest:
      additionalProperties: false
      title: IngestEventsRequest
      type: object
      required:
        - events
      properties:
        events:
          minItems: 1
          maxItems: 1000
          type: array
          items:
            $ref: "#/components/schemas/LedgerEvent"
    IngestEventsResponse:
      additionalProperties: false
      title: IngestEventsResponse
      type: object
      required:
        - accepted
        - duplicates
      properties:
        accepted:
          minimum: 0
          description: Events written by this request.
          type: integer
        duplicates:
          minimum: 0
          description: Events skipped because an event with the same id was already stored.
          type: integer
    IngestEventsError:
      additionalProperties: false
      title: IngestEventsError
      type: object
      required:
        - error
        - errors
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              const: invalid_events
              type: string
            message:
              type: string
        errors:
          type: array
          items:
            additionalProperties: false
            type: object
            required:
              - index
              - field
              - message
            properties:
              index:
                minimum: -1
                description: Position of the failing event, or -1 when the batch itself is wrong.
                type: integer
              field:
                description: Field path, for example actor.kind.
                type: string
              message:
                type: string
    EventsPage:
      additionalProperties: false
      title: EventsPage
      type: object
      required:
        - events
        - next_cursor
      properties:
        events:
          description: Newest first.
          type: array
          items:
            $ref: "#/components/schemas/LedgerEvent"
        next_cursor:
          description: Pass as cursor to get the next page. null on the last page.
          anyOf:
            - type: string
            - type: "null"
    ReviewItemsPage:
      additionalProperties: false
      title: ReviewItemsPage
      type: object
      required:
        - items
        - next_cursor
      properties:
        items:
          description: "Ranked: blocking first, then by risk score, then oldest first, then by id. Snoozed items come after the rest until their snooze ends."
          type: array
          items:
            $ref: "#/components/schemas/ReviewItem"
        next_cursor:
          description: Pass as cursor to get the next page. null on the last page.
          anyOf:
            - type: string
            - type: "null"
    DecisionRequest:
      additionalProperties: false
      title: DecisionRequest
      type: object
      required:
        - verdict
      properties:
        verdict:
          type: string
          enum:
            - approve
            - deny
            - answer
            - override
        reason:
          description: Why. For a question, the answer text.
          type: string
        by:
          minLength: 1
          description: Person who decided. Required with the admin token; a person token always decides as its own person.
          type: string
    DecisionResponse:
      additionalProperties: false
      title: DecisionResponse
      type: object
      required:
        - item
        - decision_event
      properties:
        item:
          $ref: "#/components/schemas/ReviewItem"
        decision_event:
          $ref: "#/components/schemas/LedgerEvent"
    SnoozeRequest:
      additionalProperties: false
      title: SnoozeRequest
      type: object
      required:
        - until
      properties:
        until:
          format: date-time
          description: Rank the item after the rest until this time. A time in the past ends a snooze.
          type: string
        by:
          minLength: 1
          description: Person who snoozed. Required with the admin token; a person token always snoozes as its own person.
          type: string
    ReviewItemConflict:
      additionalProperties: false
      title: ReviewItemConflict
      description: "The item is no longer open: someone answered it, it expired or was closed."
      type: object
      required:
        - error
        - item
      properties:
        error:
          additionalProperties: false
          type: object
          required:
            - code
            - message
          properties:
            code:
              const: not_open
              type: string
            message:
              description: Human-readable message.
              type: string
        item:
          $ref: "#/components/schemas/ReviewItem"
    DecisionsPage:
      additionalProperties: false
      title: DecisionsPage
      type: object
      required:
        - decisions
        - next_cursor
      properties:
        decisions:
          description: decision.recorded and policy.evaluated events, newest first.
          type: array
          items:
            $ref: "#/components/schemas/LedgerEvent"
        next_cursor:
          description: Pass as cursor to get the next page. null on the last page.
          anyOf:
            - type: string
            - type: "null"
    CreateDecisionRequest:
      additionalProperties: false
      title: CreateDecisionRequest
      type: object
      required:
        - verdict
        - by
      properties:
        verdict:
          type: string
          enum:
            - approve
            - deny
            - answer
            - override
        by:
          minLength: 1
          description: Person who decided, such as a git email or GitHub login.
          type: string
        name:
          description: Display name of the person.
          type: string
        reason:
          description: Why, in the person's own words. For a question, the answer.
          type: string
        question:
          description: "What was decided, in one line: the review item title, the pull request title or the rule change. Topic search matches it along with the reason."
          type: string
        item_id:
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-7[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
          description: Review item this decision answers.
          type: string
        run_id:
          minLength: 1
          description: Run this decision answers.
          type: string
        rule_id:
          minLength: 1
          description: Rule from selfhost.toml it is about.
          type: string
        repo:
          pattern: ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$
          description: Repository as owner/name.
          type: string
        paths:
          maxItems: 1000
          description: Files or folders the decision is about, relative to the repository root. Path search matches them.
          type: array
          items:
            minLength: 1
            type: string
        pr_url:
          format: uri
          description: Pull request URL.
          type: string
        run_url:
          format: uri
          description: CI run or agent run URL.
          type: string
        commit_sha:
          pattern: ^[0-9a-f]{7,64}$
          description: Git commit SHA.
          type: string
        replaces_event_id:
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-7[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
          description: Decision this one corrects or overturns. The earlier event stays as it was; item, run, rule, question, paths and links not given here are carried over from it.
          type: string
        surface:
          default: api
          description: Where the person decided.
          type: string
          enum:
            - cli
            - rule_promotion
            - exception_approval
            - github_review
            - github_comment
            - slack
            - telegram
            - mcp
            - api
            - timeout
        key:
          minLength: 1
          maxLength: 256
          description: "Idempotency key: the surface's own id for this action, such as a GitHub review id or a Slack action id. Sent again with the same ts, it writes nothing new."
          type: string
        ts:
          format: date-time
          description: "When the person decided. Default: now. Required with key."
          type: string
    CreateDecisionResponse:
      additionalProperties: false
      title: CreateDecisionResponse
      type: object
      required:
        - decision_event
        - duplicate
      properties:
        decision_event:
          $ref: "#/components/schemas/LedgerEvent"
        duplicate:
          description: true when this action was already recorded, so nothing new was written.
          type: boolean
    PolicyResponse:
      additionalProperties: false
      title: PolicyResponse
      type: object
      required:
        - hash
        - loaded_at
        - config
        - effective_rules
      properties:
        hash:
          description: sha256 of the selfhost.toml text in use.
          type: string
        team:
          description: Team id, when the policy is a team's.
          type: string
        text:
          description: The selfhost.toml text in use.
          type: string
        commit_sha:
          description: Git commit of selfhost.toml, when it is read from a repo.
          type: string
        loaded_at:
          format: date-time
          type: string
        config:
          $ref: "#/components/schemas/SelfhostConfig"
        effective_rules:
          description: Rules after team overrides for the given person and agent, with defaults applied. Rules in mode off are left out.
          type: array
          items:
            additionalProperties: false
            type: object
            required:
              - id
              - match
              - action
              - message
            properties:
              id:
                pattern: ^[A-Za-z0-9][A-Za-z0-9_.-]*$
                description: Stable rule id, recorded on every decision the rule makes.
                type: string
              description:
                description: What the rule is for.
                type: string
              mode:
                description: observe records what the rule would have done, enforce applies it, off disables it.
                default: observe
                type: string
                enum:
                  - observe
                  - enforce
                  - off
              agents:
                minItems: 1
                description: Agents the rule applies to. "all" matches every agent.
                default:
                  - all
                type: array
                items:
                  type: string
                  enum:
                    - all
                    - claude_code
                    - codex
                    - opencode
                    - goose
                    - cursor
                    - copilot
                    - other
              match:
                additionalProperties: false
                minProperties: 1
                description: What the rule matches. Every field given must match.
                type: object
                properties:
                  tool:
                    minLength: 1
                    description: Exact tool name, for example Bash, Edit or an MCP tool name.
                    type: string
                  command:
                    minLength: 1
                    description: Regular expression tested against shell commands.
                    type: string
                  path:
                    minLength: 1
                    description: Glob tested against file paths relative to the repository root.
                    type: string
                  url:
                    minLength: 1
                    description: Glob tested against URLs the agent requests.
                    type: string
              action:
                description: block stops the action, ask sends it to a person.
                type: string
                enum:
                  - block
                  - ask
              message:
                minLength: 1
                description: Shown to the agent and the person when the rule fires.
                type: string
              irreversible:
                default: false
                description: true when the matched action cannot be undone, which raises review risk.
                type: boolean
    PolicyCoverageResponse:
      additionalProperties: false
      title: PolicyCoverageResponse
      description: "What selfhost policy compile would write for the team's selfhost.toml: per rule and vendor, whether the vendor's native controls express it and whether the selfhost hook covers the rest."
      type: object
      required:
        - hash
        - team
        - coverage
      properties:
        hash:
          description: sha256 of the selfhost.toml text compiled.
          type: string
        team:
          description: Team id.
          type: string
        coverage:
          additionalProperties: false
          title: PolicyCoverage
          type: object
          required:
            - schema
            - team
            - vendors
            - rules
          properties:
            schema:
              const: selfhost.policy_coverage/v1
              type: string
            team:
              description: Team whose overrides were applied, or null.
              anyOf:
                - type: string
                - type: "null"
            vendors:
              type: array
              items:
                additionalProperties: false
                title: VendorCoverage
                type: object
                required:
                  - vendor
                  - version
                  - docs
                  - notes
                properties:
                  vendor:
                    type: string
                    enum:
                      - claude_code
                      - codex
                      - cursor
                      - copilot
                  version:
                    description: Vendor config version the output targets.
                    type: string
                  docs:
                    description: Vendor docs the mapping follows.
                    type: array
                    items:
                      type: string
                  notes:
                    description: Side effects and checks still open for this vendor.
                    type: array
                    items:
                      type: string
            rules:
              description: "One entry per rule and vendor, in rule order then vendor order: rules in file order, then mcp.allow, then models.allow."
              type: array
              items:
                additionalProperties: false
                title: RuleCoverage
                type: object
                required:
                  - rule_id
                  - vendor
                  - mode
                  - action
                  - status
                  - native
                  - hook
                  - detail
                properties:
                  rule_id:
                    description: Rule id, or mcp.allow and models.allow.
                    type: string
                  vendor:
                    type: string
                    enum:
                      - claude_code
                      - codex
                      - cursor
                      - copilot
                  mode:
                    description: Mode after the team's overrides.
                    type: string
                    enum:
                      - observe
                      - enforce
                      - off
                  action:
                    type: string
                    enum:
                      - block
                      - ask
                  status:
                    description: What the vendor's native controls express once the rule is enforced. Observe rules write nothing native.
                    type: string
                    enum:
                      - compiled
                      - partial
                      - not_expressible
                      - not_applicable
                  native:
                    description: Native entries written for the rule, like Bash(git push --force*). Empty when nothing is written.
                    type: array
                    items:
                      type: string
                  hook:
                    description: What the selfhost pre-tool hook does for the rule on this vendor.
                    type: string
                    enum:
                      - enforce
                      - record
                      - none
                  detail:
                    description: Why, and what is left uncovered.
                    type: string
    SetPolicyRequest:
      additionalProperties: false
      title: SetPolicyRequest
      type: object
      required:
        - text
      properties:
        text:
          maxLength: 1000000
          description: The team's selfhost.toml. Validated like selfhost doctor does.
          type: string
    InvalidPolicyError:
      additionalProperties: false
      title: InvalidPolicyError
      type: object
      required:
        - error
        - errors
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              const: invalid_policy
              type: string
            message:
              type: string
        errors:
          type: array
          items:
            additionalProperties: false
            type: object
            required:
              - field
              - message
            properties:
              field:
                description: Field path, for example rules[0].mode.
                type: string
              message:
                type: string
              line:
                minimum: 1
                type: integer
              column:
                minimum: 1
                type: integer
    CreateTeamRequest:
      additionalProperties: false
      title: CreateTeamRequest
      type: object
      required:
        - name
      properties:
        name:
          minLength: 1
          maxLength: 100
          description: Team name. Its id is the name in kebab case.
          type: string
        invite_ttl_seconds:
          minimum: 60
          maximum: 31536000
          default: 604800
          description: How long the team's first invite works, in seconds. Default 7 days.
          type: integer
    CreateTeamResponse:
      additionalProperties: false
      title: CreateTeamResponse
      type: object
      required:
        - team
        - invite
        - invite_expires_at
      properties:
        team:
          additionalProperties: false
          title: TeamInfo
          type: object
          required:
            - id
            - name
            - created_at
          properties:
            id:
              pattern: ^[a-z0-9](?:[a-z0-9-]{0,62}[a-z0-9])?$
              description: Team id, derived from the name. Set as team on every event its people write.
              type: string
            name:
              minLength: 1
              description: Team name as given.
              type: string
            created_at:
              format: date-time
              type: string
        invite:
          minLength: 1
          description: Invite code to share with the team. Anyone holding it can join, so share it like a password.
          type: string
        invite_expires_at:
          format: date-time
          description: When the invite stops working.
          type: string
    CreateInviteRequest:
      additionalProperties: false
      title: CreateInviteRequest
      type: object
      properties:
        ttl_seconds:
          minimum: 60
          maximum: 31536000
          default: 604800
          description: How long the invite works, in seconds. Default 7 days.
          type: integer
        email:
          pattern: ^[^@\s]+@[^@\s]+$
          maxLength: 256
          description: The one person the invite is for. Joining with it is refused for any other person id.
          type: string
    CreateInviteResponse:
      additionalProperties: false
      title: CreateInviteResponse
      type: object
      required:
        - invite
        - id
        - team
        - expires_at
      properties:
        invite:
          minLength: 1
          description: Invite code. Without an email anyone holding it can join until it expires, so share it like a password.
          type: string
        id:
          pattern: ^[0-9a-f]{64}$
          description: sha256 of the invite code, in hex. Names the invite in DELETE /v1/invites/{id} without carrying the code.
          type: string
        team:
          pattern: ^[a-z0-9](?:[a-z0-9-]{0,62}[a-z0-9])?$
          description: Team the invite joins.
          type: string
        email:
          description: The person the invite is for.
          type: string
        expires_at:
          format: date-time
          description: When the invite stops working.
          type: string
    Invite:
      additionalProperties: false
      title: Invite
      type: object
      required:
        - id
        - team
        - created_at
        - expires_at
      properties:
        id:
          pattern: ^[0-9a-f]{64}$
          description: sha256 of the invite code, in hex. Names the invite in DELETE /v1/invites/{id} without carrying the code.
          type: string
        team:
          pattern: ^[a-z0-9](?:[a-z0-9-]{0,62}[a-z0-9])?$
          description: Team the invite joins.
          type: string
        email:
          description: The person the invite is for. Joining with it makes this email the person id.
          type: string
        created_at:
          format: date-time
          type: string
        expires_at:
          format: date-time
          description: When the invite stops working.
          type: string
        revoked_at:
          format: date-time
          description: When the invite was revoked.
          type: string
    RevokeTokensResponse:
      additionalProperties: false
      title: RevokeTokensResponse
      type: object
      required:
        - team
        - person
        - revoked
      properties:
        team:
          pattern: ^[a-z0-9](?:[a-z0-9-]{0,62}[a-z0-9])?$
          description: Team of the person.
          type: string
        person:
          minLength: 1
          maxLength: 256
          description: Person whose tokens were revoked.
          type: string
        revoked:
          minimum: 0
          description: Tokens revoked by this call; 0 when they were all revoked already.
          type: integer
    JoinRequest:
      additionalProperties: false
      title: JoinRequest
      type: object
      required:
        - invite
        - person
      properties:
        invite:
          minLength: 1
          description: Invite code from POST /v1/teams or POST /v1/teams/{team}/invites.
          type: string
        person:
          minLength: 1
          maxLength: 256
          description: Who is joining, such as their git email. A team-wide invite takes only an id not yet in the team; an invite for an email takes only that email.
          type: string
        name:
          maxLength: 200
          description: Display name.
          type: string
    JoinResponse:
      additionalProperties: false
      title: JoinResponse
      type: object
      required:
        - token
        - person
        - team
      properties:
        token:
          minLength: 1
          description: Person token. It writes events as this person and reads the team's events and policy. Shown once; the server keeps only its sha256.
          type: string
        person:
          additionalProperties: false
          title: Person
          type: object
          required:
            - id
            - team
            - role
            - created_at
          properties:
            id:
              minLength: 1
              maxLength: 256
              description: Who the person is, such as a git email. Their events carry it as actor.id.
              type: string
            name:
              description: Display name.
              type: string
            team:
              pattern: ^[a-z0-9](?:[a-z0-9-]{0,62}[a-z0-9])?$
              description: Team the person belongs to.
              type: string
            role:
              description: owner for the first person to join, member for everyone after.
              type: string
              enum:
                - owner
                - admin
                - member
            created_at:
              format: date-time
              type: string
        team:
          additionalProperties: false
          title: TeamInfo
          type: object
          required:
            - id
            - name
            - created_at
          properties:
            id:
              pattern: ^[a-z0-9](?:[a-z0-9-]{0,62}[a-z0-9])?$
              description: Team id, derived from the name. Set as team on every event its people write.
              type: string
            name:
              minLength: 1
              description: Team name as given.
              type: string
            created_at:
              format: date-time
              type: string
    MeResponse:
      additionalProperties: false
      title: MeResponse
      type: object
      required:
        - kind
      properties:
        kind:
          description: admin for the server's admin token, person for a person token.
          type: string
          enum:
            - admin
            - person
        person:
          additionalProperties: false
          title: Person
          type: object
          required:
            - id
            - team
            - role
            - created_at
          properties:
            id:
              minLength: 1
              maxLength: 256
              description: Who the person is, such as a git email. Their events carry it as actor.id.
              type: string
            name:
              description: Display name.
              type: string
            team:
              pattern: ^[a-z0-9](?:[a-z0-9-]{0,62}[a-z0-9])?$
              description: Team the person belongs to.
              type: string
            role:
              description: owner for the first person to join, member for everyone after.
              type: string
              enum:
                - owner
                - admin
                - member
            created_at:
              format: date-time
              type: string
        team:
          additionalProperties: false
          title: TeamInfo
          type: object
          required:
            - id
            - name
            - created_at
          properties:
            id:
              pattern: ^[a-z0-9](?:[a-z0-9-]{0,62}[a-z0-9])?$
              description: Team id, derived from the name. Set as team on every event its people write.
              type: string
            name:
              minLength: 1
              description: Team name as given.
              type: string
            created_at:
              format: date-time
              type: string
