              description: "Share of input tokens read from the prompt cache, 0 to 1: cache reads over cache reads plus uncached input plus cache writes, counting only sessions that reported a cache read or write. null when no session in the group reported a cache read or write, as for agents whose logs carry no cache fields."
              anyOf:
                - minimum: 0
                  maximum: 1
                  type: number
                - type: "null"
