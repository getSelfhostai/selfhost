          schema:
            type: string
      responses:
        "200":
          description: The keys.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayKeysResponse"
        "400":
          description: No team given with the admin token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The caller is not in the team, or their role there does not allow this. The message names the role needed and the caller's own.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: No gateway is configured on this server.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      operationId: issueGatewayKey
      summary: Issue a gateway key and return its value, once.
      description: A person key goes only to its person, with their person token. A team key needs the owner or admin role, or the admin token. A run key needs anyone in the team. The value is in this answer only; selfhost keeps no copy.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IssueGatewayKeyRequest"
      responses:
        "201":
          description: Key issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssueGatewayKeyResponse"
        "400":
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The caller is not in the team, or their role there does not allow this. The message names the role needed and the caller's own.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: No gateway is configured on this server.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
