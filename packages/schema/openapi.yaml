# Generated from packages/schema/src. Run `pnpm --filter @selfhost/schema export` after changing the source. Do not edit by hand.
openapi: 3.1.0
info:
  title: selfhost API
  version: "1"
  description: "HTTP API of the selfhost server: ledger ingest and search, the review list and team policy. Laptop, self-hosted and hosted installs serve the same API."
  license:
    name: Apache-2.0
    identifier: Apache-2.0
security:
  - bearerAuth: []
paths:
  /v1/health:
    get:
      operationId: getHealth
      summary: Liveness check.
      security: []
      responses:
        "200":
          description: Server is up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /v1/events:
    post:
      operationId: ingestEvents
      summary: Append a batch of ledger events.
      description: "Atomic: if any event is invalid, nothing is written and the response lists every error by index and field. Event ids are idempotency keys, so retrying a batch is safe. With a person token, events whose actor is a person must carry that person's id (an event with no actor gets it), system actors are refused, and team is set to the person's team."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IngestEventsRequest"
      responses:
        "200":
          description: All events stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestEventsResponse"
        "400":
          description: At least one event is invalid. Nothing was written.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestEventsError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          description: More than 1000 events in one batch.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    get:
      operationId: listEvents
      summary: Search ledger events.
      description: "With a person token, only events written with that team's person tokens: the team filter is the token's team."
      parameters:
        - name: person
          in: query
          required: false
          description: actor.id of a person.
          schema:
            type: string
        - name: agent
          in: query
          required: false
          description: agent.vendor.
          schema:
            type: string
            enum:
              - claude_code
              - codex
              - opencode
              - goose
              - cursor
              - copilot
              - other
        - name: model
          in: query
          required: false
          schema:
            type: string
        - name: session
          in: query
          required: false
          description: session_id.
          schema:
            type: string
        - name: kind
          in: query
          required: false
          schema:
            type: string
            enum:
              - session.started
              - session.ended
              - prompt.submitted
              - tool.called
              - tool.result
              - approval.requested
              - decision.recorded
              - cost.recorded
              - commit.created
              - pr.opened
              - pr.merged
              - pr.closed
              - policy.evaluated
              - alert.raised
        - name: team
          in: query
          required: false
          description: "Team id on a team server: events written with that team's person tokens. A person token reads only its own team."
          schema:
            type: string
        - name: from
          in: query
          required: false
          description: Events at or after this time.
          schema:
            format: date-time
            type: string
        - name: to
          in: query
          required: false
          description: Events before this time.
          schema:
            format: date-time
            type: string
        - name: limit
          in: query
          required: false
          description: Maximum number of results.
          schema:
            minimum: 1
            maximum: 1000
            default: 100
            type: integer
        - name: cursor
          in: query
          required: false
          description: Opaque cursor from next_cursor of the previous page.
          schema:
            type: string
      responses:
        "200":
          description: One page of events.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventsPage"
        "400":
          description: Invalid filter.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: A person token asked for another team's events.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/review-items:
    get:
      operationId: listReviewItems
      summary: List review items, ranked.
      parameters:
        - name: state
          in: query
          required: false
          schema:
            default: open
            type: string
            enum:
              - open
              - answered
              - dismissed
              - expired
        - name: owner
          in: query
          required: false
          description: Only items this person owns.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Maximum number of results.
          schema:
            minimum: 1
            maximum: 1000
            default: 100
            type: integer
        - name: cursor
          in: query
          required: false
          description: Opaque cursor from next_cursor of the previous page.
          schema:
            type: string
      responses:
        "200":
          description: One page of items.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewItemsPage"
        "400":
          description: Invalid filter.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/review-items/{id}/decision:
    post:
      operationId: recordDecision
      summary: Answer a review item.
      description: Writes a decision.recorded event, attributed to the person the token belongs to, and closes the item.
      parameters:
        - name: id
          in: path
          required: true
          description: Review item id.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecisionRequest"
      responses:
        "200":
          description: Decision recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DecisionResponse"
        "400":
          description: Invalid decision.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No such review item.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: The item is no longer open.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/policy:
    get:
      operationId: getPolicy
      summary: Get the team config in use and the rules that apply.
      parameters:
        - name: person
          in: query
          required: false
          description: Resolve team overrides for this person.
          schema:
            type: string
        - name: agent
          in: query
          required: false
          description: Only rules for this agent.
          schema:
            type: string
            enum:
              - claude_code
              - codex
              - opencode
              - goose
              - cursor
              - copilot
              - other
        - name: team
          in: query
          required: false
          description: Team id on a team server. Needed with the admin token; a person token reads its own team.
          schema:
            type: string
      responses:
        "200":
          description: Policy in use.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyResponse"
        "400":
          description: Invalid query, or no team given with the admin token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: A person token asked for another team's policy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: No such team, or the team has no policy yet.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    put:
      operationId: setPolicy
      summary: Replace a team's selfhost.toml.
      description: Admin token, or a person token whose role is owner or admin. The text is validated first; an invalid file changes nothing.
      parameters:
        - name: team
          in: query
          required: false
          description: Team id. Needed with the admin token; a person token writes its own team.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetPolicyRequest"
      responses:
        "200":
          description: Policy stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyResponse"
        "400":
          description: The selfhost.toml is invalid. Nothing was stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvalidPolicyError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The person token's role is not owner or admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: No such team.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/teams:
    post:
      operationId: createTeam
      summary: Create a team and its invite code.
      description: Admin token only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTeamRequest"
      responses:
        "201":
          description: Team created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateTeamResponse"
        "400":
          description: Invalid name or invite lifetime.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: A team with this id already exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/teams/{team}/invites:
    post:
      operationId: createInvite
      summary: Create another invite code for a team.
      description: Admin token only. The invite expires after ttl_seconds (default 7 days). With an email, only that person can join with it, and their person id is the email.
      parameters:
        - name: team
          in: path
          required: true
          description: Team id.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInviteRequest"
      responses:
        "201":
          description: Invite created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateInviteResponse"
        "400":
          description: Invalid lifetime or email.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No such team.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/invites/{id}:
    delete:
      operationId: revokeInvite
      summary: Revoke an invite code.
      description: Admin token only. Joining with a revoked invite answers 401. People who already joined keep their tokens. Revoking twice is not an error.
      parameters:
        - name: id
          in: path
          required: true
          description: sha256 of the invite code, in hex.
          schema:
            type: string
      responses:
        "200":
          description: Invite revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invite"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No such invite.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/teams/{team}/people/{person}/tokens:
    delete:
      operationId: revokePersonTokens
      summary: Revoke every token a person holds.
      description: Admin token only. The person's events stay in the ledger; their tokens answer 401 from now on. They can join again only with a new invite.
      parameters:
        - name: team
          in: path
          required: true
          description: Team id.
          schema:
            type: string
        - name: person
          in: path
          required: true
          description: Person id.
          schema:
            type: string
      responses:
        "200":
          description: Tokens revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevokeTokensResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No such team or person.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/join:
    post:
      operationId: joinTeam
      summary: Exchange an invite code for a person token.
      description: "The invite code is the credential, so no bearer token is needed. A team-wide invite only adds new people: a person id already in the team (compared ignoring case) is refused, so the holder cannot take over the owner's or anyone else's identity. An invite for an email joins only that person, also when they are already in the team, which adds another token for them."
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JoinRequest"
      responses:
        "200":
          description: Joined.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JoinResponse"
        "400":
          description: Invalid body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Unknown, expired or revoked invite code, or an invite for another person.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/me:
    get:
      operationId: getMe
      summary: Who the bearer token belongs to.
      responses:
        "200":
          description: The token's owner.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/me/token:
    delete:
      operationId: revokeOwnToken
      summary: Revoke the person token that makes this request.
      description: What selfhost team leave calls. Only that token is revoked; the person's other tokens and their events stay.
      responses:
        "200":
          description: Token revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevokeTokensResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The admin token is set on the server and cannot be revoked here.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: API token from the selfhost server.
  responses:
    Unauthorized:
      description: Missing or invalid bearer token.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
  schemas:
    LedgerEvent:
      $ref: ./json/event.schema.json
    ReviewItem:
      $ref: ./json/review-item.schema.json
    SelfhostConfig:
      $ref: ./json/config.schema.json
    HealthResponse:
      additionalProperties: false
      title: HealthResponse
      type: object
      required:
        - ok
        - version
      properties:
        ok:
          const: true
          type: boolean
        version:
          description: Server version.
          type: string
    ApiError:
      additionalProperties: false
      title: ApiError
      type: object
      required:
        - error
      properties:
        error:
          additionalProperties: false
          type: object
          required:
            - code
            - message
          properties:
            code:
              description: Stable machine-readable code, for example not_found.
              type: string
            message:
              description: Human-readable message.
              type: string
    IngestEventsRequest:
      additionalProperties: false
      title: IngestEventsRequest
      type: object
      required:
        - events
      properties:
        events:
          minItems: 1
          maxItems: 1000
          type: array
          items:
            $ref: "#/components/schemas/LedgerEvent"
    IngestEventsResponse:
      additionalProperties: false
      title: IngestEventsResponse
      type: object
      required:
        - accepted
        - duplicates
      properties:
        accepted:
          minimum: 0
          description: Events written by this request.
          type: integer
        duplicates:
          minimum: 0
          description: Events skipped because an event with the same id was already stored.
          type: integer
    IngestEventsError:
      additionalProperties: false
      title: IngestEventsError
      type: object
      required:
        - error
        - errors
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              const: invalid_events
              type: string
            message:
              type: string
        errors:
          type: array
          items:
            additionalProperties: false
            type: object
            required:
              - index
              - field
              - message
            properties:
              index:
                minimum: -1
                description: Position of the failing event, or -1 when the batch itself is wrong.
                type: integer
              field:
                description: Field path, for example actor.kind.
                type: string
              message:
                type: string
    EventsPage:
      additionalProperties: false
      title: EventsPage
      type: object
      required:
        - events
        - next_cursor
      properties:
        events:
          description: Newest first.
          type: array
          items:
            $ref: "#/components/schemas/LedgerEvent"
        next_cursor:
          description: Pass as cursor to get the next page. null on the last page.
          anyOf:
            - type: string
            - type: "null"
    ReviewItemsPage:
      additionalProperties: false
      title: ReviewItemsPage
      type: object
      required:
        - items
        - next_cursor
      properties:
        items:
          description: "Ranked: blocking first, then by risk score, then oldest first."
          type: array
          items:
            $ref: "#/components/schemas/ReviewItem"
        next_cursor:
          description: Pass as cursor to get the next page. null on the last page.
          anyOf:
            - type: string
            - type: "null"
    DecisionRequest:
      additionalProperties: false
      title: DecisionRequest
      type: object
      required:
        - verdict
      properties:
        verdict:
          type: string
          enum:
            - approve
            - deny
            - answer
            - override
        reason:
          description: Why. For a question, the answer text.
          type: string
    DecisionResponse:
      additionalProperties: false
      title: DecisionResponse
      type: object
      required:
        - item
        - decision_event
      properties:
        item:
          $ref: "#/components/schemas/ReviewItem"
        decision_event:
          $ref: "#/components/schemas/LedgerEvent"
    PolicyResponse:
      additionalProperties: false
      title: PolicyResponse
      type: object
      required:
        - hash
        - loaded_at
        - config
        - effective_rules
      properties:
        hash:
          description: sha256 of the selfhost.toml text in use.
          type: string
        team:
          description: Team id, when the policy is a team's.
          type: string
        text:
          description: The selfhost.toml text in use.
          type: string
        commit_sha:
          description: Git commit of selfhost.toml, when it is read from a repo.
          type: string
        loaded_at:
          format: date-time
          type: string
        config:
          $ref: "#/components/schemas/SelfhostConfig"
        effective_rules:
          description: Rules after team overrides for the given person and agent, with defaults applied. Rules in mode off are left out.
          type: array
          items:
            additionalProperties: false
            type: object
            required:
              - id
              - match
              - action
              - message
            properties:
              id:
                pattern: ^[A-Za-z0-9][A-Za-z0-9_.-]*$
                description: Stable rule id, recorded on every decision the rule makes.
                type: string
              description:
                description: What the rule is for.
                type: string
              mode:
                description: observe records what the rule would have done, enforce applies it, off disables it.
                default: observe
                type: string
                enum:
                  - observe
                  - enforce
                  - off
              agents:
                minItems: 1
                description: Agents the rule applies to. "all" matches every agent.
                default:
                  - all
                type: array
                items:
                  type: string
                  enum:
                    - all
                    - claude_code
                    - codex
                    - opencode
                    - goose
                    - cursor
                    - copilot
                    - other
              match:
                additionalProperties: false
                minProperties: 1
                description: What the rule matches. Every field given must match.
                type: object
                properties:
                  tool:
                    minLength: 1
                    description: Exact tool name, for example Bash, Edit or an MCP tool name.
                    type: string
                  command:
                    minLength: 1
                    description: Regular expression tested against shell commands.
                    type: string
                  path:
                    minLength: 1
                    description: Glob tested against file paths relative to the repository root.
                    type: string
                  url:
                    minLength: 1
                    description: Glob tested against URLs the agent requests.
                    type: string
              action:
                description: block stops the action, ask sends it to a person.
                type: string
                enum:
                  - block
                  - ask
              message:
                minLength: 1
                description: Shown to the agent and the person when the rule fires.
                type: string
              irreversible:
                default: false
                description: true when the matched action cannot be undone, which raises review risk.
                type: boolean
    SetPolicyRequest:
      additionalProperties: false
      title: SetPolicyRequest
      type: object
      required:
        - text
      properties:
        text:
          maxLength: 1000000
          description: The team's selfhost.toml. Validated like selfhost doctor does.
          type: string
    InvalidPolicyError:
      additionalProperties: false
      title: InvalidPolicyError
      type: object
      required:
        - error
        - errors
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              const: invalid_policy
              type: string
            message:
              type: string
        errors:
          type: array
          items:
            additionalProperties: false
            type: object
            required:
              - field
              - message
            properties:
              field:
                description: Field path, for example rules[0].mode.
                type: string
              message:
                type: string
              line:
                minimum: 1
                type: integer
              column:
                minimum: 1
                type: integer
    CreateTeamRequest:
      additionalProperties: false
      title: CreateTeamRequest
      type: object
      required:
        - name
      properties:
        name:
          minLength: 1
          maxLength: 100
          description: Team name. Its id is the name in kebab case.
          type: string
        invite_ttl_seconds:
          minimum: 60
          maximum: 31536000
          default: 604800
          description: How long the team's first invite works, in seconds. Default 7 days.
          type: integer
    CreateTeamResponse:
      additionalProperties: false
      title: CreateTeamResponse
      type: object
      required:
        - team
        - invite
        - invite_expires_at
      properties:
        team:
          additionalProperties: false
          title: TeamInfo
          type: object
          required:
            - id
            - name
            - created_at
          properties:
            id:
              pattern: ^[a-z0-9](?:[a-z0-9-]{0,62}[a-z0-9])?$
              description: Team id, derived from the name. Set as team on every event its people write.
              type: string
            name:
              minLength: 1
              description: Team name as given.
              type: string
            created_at:
              format: date-time
              type: string
        invite:
          minLength: 1
          description: Invite code to share with the team. Anyone holding it can join, so share it like a password.
          type: string
        invite_expires_at:
          format: date-time
          description: When the invite stops working.
          type: string
    CreateInviteRequest:
      additionalProperties: false
      title: CreateInviteRequest
      type: object
      properties:
        ttl_seconds:
          minimum: 60
          maximum: 31536000
          default: 604800
          description: How long the invite works, in seconds. Default 7 days.
          type: integer
        email:
          pattern: ^[^@\s]+@[^@\s]+$
          maxLength: 256
          description: The one person the invite is for. Joining with it is refused for any other person id.
          type: string
    CreateInviteResponse:
      additionalProperties: false
      title: CreateInviteResponse
      type: object
      required:
        - invite
        - id
        - team
        - expires_at
      properties:
        invite:
          minLength: 1
          description: Invite code. Without an email anyone holding it can join until it expires, so share it like a password.
          type: string
        id:
          pattern: ^[0-9a-f]{64}$
          description: sha256 of the invite code, in hex. Names the invite in DELETE /v1/invites/{id} without carrying the code.
          type: string
        team:
          pattern: ^[a-z0-9](?:[a-z0-9-]{0,62}[a-z0-9])?$
          description: Team the invite joins.
          type: string
        email:
          description: The person the invite is for.
          type: string
        expires_at:
          format: date-time
