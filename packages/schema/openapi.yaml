              minimum: 0
              description: cost.recorded events, one per model request.
              type: integer
            sessions:
              minimum: 0
              description: Distinct agent sessions (agent and session_id) with a session, prompt or cost event in the range.
              type: integer
            prs_opened:
              minimum: 0
              description: Distinct pull requests with a pr.opened event in the range.
