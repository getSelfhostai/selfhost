  /v1/orgs/{org}/policy:
    get:
      operationId: getOrgPolicy
      summary: "Get the org floor: the selfhost.toml every team and repo builds on."
      description: The admin token, or a person token of anyone in the org. conflicts lists stored team and repo rules that relax it.
      parameters:
        - name: org
          in: path
          required: true
          description: Org id.
          schema:
            type: string
      responses:
        "200":
          description: The org policy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgPolicyResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
