      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              const: invalid_policy
              type: string
            message:
              type: string
        errors:
          type: array
          items:
            additionalProperties: false
            type: object
            required:
              - field
              - message
            properties:
              field:
                description: Field path, for example rules[0].mode.
                type: string
              message:
                type: string
              line:
                minimum: 1
                type: integer
              column:
                minimum: 1
                type: integer
              org_rule:
                description: The org rule or setting this would relax, such as rule "no-force-push" or [mcp] allow. Set only for errors against the org floor.
                type: string
    CreateTeamRequest:
      additionalProperties: false
