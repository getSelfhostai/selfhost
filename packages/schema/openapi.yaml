          description: "Teams the caller sees: every team of the org they are in with a person token, or null with the admin token, which also sees events with no team."
          anyOf:
            - type: array
              items:
                type: string
            - type: "null"
        rows:
          description: "One per group with any usage: by day (oldest first) when grouped by day, then by usd (highest first), then by group. A session is distinct, so it counts once in every group its events fall in and the rows can add up to more sessions than the total."
          type: array
          items:
            additionalProperties: false
            title: UsageRow
            type: object
            required:
              - group
              - usd
              - tokens
              - input_tokens
              - output_tokens
              - cache_read_tokens
              - cache_write_tokens
              - requests
              - sessions
              - prs_opened
              - prs_merged
            properties:
              group:
                additionalProperties: false
                title: UsageGroup
                description: The value of each grouped dimension.
                type: object
                properties:
                  team:
                    description: Team id, or unknown for none.
                    type: string
                  person:
                    description: actor.id when the actor is a person, else unknown.
                    type: string
                  agent:
                    description: agent.vendor, or unknown.
                    type: string
                  model:
                    description: Model id, or unknown.
                    type: string
                  day:
                    pattern: ^\d{4}-\d{2}-\d{2}$
                    description: UTC day, YYYY-MM-DD.
                    type: string
              usd:
                minimum: 0
                description: Cost in US dollars of the cost.recorded events, rounded to 6 decimals.
                type: number
              tokens:
                minimum: 0
                description: The four token counts added up.
                type: integer
              input_tokens:
                minimum: 0
                description: Uncached input tokens.
                type: integer
              output_tokens:
                minimum: 0
                description: Output tokens, including reasoning tokens.
                type: integer
              cache_read_tokens:
                minimum: 0
                description: Input tokens read from the prompt cache.
                type: integer
              cache_write_tokens:
                minimum: 0
                description: Input tokens written to the prompt cache.
                type: integer
              requests:
                minimum: 0
                description: cost.recorded events, one per model request.
                type: integer
              sessions:
                minimum: 0
                description: Distinct agent sessions (agent and session_id) with a session, prompt or cost event in the range.
                type: integer
              prs_opened:
                minimum: 0
                description: Distinct pull requests with a pr.opened event in the range.
                type: integer
              prs_merged:
                minimum: 0
                description: Distinct pull requests with a pr.merged event in the range.
                type: integer
        total:
          additionalProperties: false
          title: UsageTotals
          type: object
          required:
            - usd
            - tokens
            - input_tokens
            - output_tokens
            - cache_read_tokens
            - cache_write_tokens
            - requests
            - sessions
            - prs_opened
            - prs_merged
          properties:
