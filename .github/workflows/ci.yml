name: CI

on:
  # Branches only: a v* tag runs these jobs through release.yml, which calls this workflow.
  push:
    branches: ["**"]
  pull_request:
  workflow_call:

permissions:
  contents: read

# The workflow name keeps a call from release.yml (named Release there) apart from a push run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: selfhost
          POSTGRES_USER: selfhost
          POSTGRES_PASSWORD: selfhost
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U selfhost -d selfhost"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://selfhost:selfhost@localhost:5432/selfhost
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check that the version and the image owner agree everywhere
        run: node scripts/release/version.mjs --check
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  cli:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Fixture logs for the import checks, never the runner's home directory.
      CLAUDE_CONFIG_DIR: ${{ github.workspace }}/fixtures/claude-code
      CODEX_HOME: ${{ github.workspace }}/fixtures/codex
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # Keep in step with the bun entry in the pnpm-workspace.yaml catalog.
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.4.4
      - run: pnpm install --frozen-lockfile
      - name: Write the embedded ledger check
        run: |
          cat > "$RUNNER_TEMP/ledger-check.sh" <<'SH'
          # Usage: ledger-check.sh <command that runs selfhost>. Imports the fixture logs into a
          # fresh embedded ledger twice (the second run finds only duplicates), then reads spend.
          set -eu
          data="$(mktemp -d)"
          "$@" import --data-dir "$data" --since 2026-01-01 --json > "$data.first.json"
          "$@" import --data-dir "$data" --since 2026-01-01 --json > "$data.second.json"
          jq -es '.[0].accepted > 0 and .[0].duplicates == 0 and .[1].accepted == 0
            and .[1].duplicates == .[0].accepted' "$data.first.json" "$data.second.json"
          "$@" spend --data-dir "$data" --since 2026-01-01 --json | jq -e '.total.requests > 0'
          SH
      - name: Smoke test the Node bundle
        run: |
          pnpm --filter "@selfhost/cli..." --filter @selfhost/console build
          node apps/cli/dist/main.js --version
          node apps/cli/dist/main.js policy --help
          node apps/cli/dist/main.js policy test presets
          sh "$RUNNER_TEMP/ledger-check.sh" node apps/cli/dist/main.js
      - name: Pack the npm package and install it in a clean folder with an empty HOME
        run: |
          node scripts/release/pack-cli.mjs --out "$RUNNER_TEMP/npm"
          sh scripts/release/smoke.sh "$RUNNER_TEMP/npm/selfhostai-$(node scripts/release/version.mjs --print).tgz" \
            "$(node scripts/release/version.mjs --print)"
      - run: pnpm build:cli
      - name: Smoke test the linux-x64 binary
        run: |
          ./apps/cli/dist/selfhost-linux-x64 --version
          ./apps/cli/dist/selfhost-linux-x64 doctor
          # The presets' own tests, with the binary's regular expression engine.
          ./apps/cli/dist/selfhost-linux-x64 policy test presets
          sh "$RUNNER_TEMP/ledger-check.sh" ./apps/cli/dist/selfhost-linux-x64
      - name: Run the binary with an empty environment and no Node or Bun on PATH
        run: |
          bin="$PWD/apps/cli/dist/selfhost-linux-x64"
          empty="$(mktemp -d)"
          if env -i PATH="$empty" /bin/sh -c 'command -v node || command -v bun'; then
            echo "node or bun is still reachable on PATH" >&2
            exit 1
          fi
          env -i PATH="$empty" "$bin" --version
          env -i PATH="$empty" "$bin" agents --json > agents.json
          env -i PATH="$empty" "$bin" doctor --json
          grep -q '"schema": "selfhost.agents/v1"' agents.json
          sh "$RUNNER_TEMP/ledger-check.sh" env -i PATH="$empty" \
            CLAUDE_CONFIG_DIR="$CLAUDE_CONFIG_DIR" CODEX_HOME="$CODEX_HOME" "$bin"
      # Kept briefly for a manual download; a full artifact quota must not fail the build.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        continue-on-error: true
        with:
          name: selfhost-cli
          path: apps/cli/dist/selfhost-*
          if-no-files-found: error
          retention-days: 3

  # The proof receipt action (ee/receipt) end to end on the sample app in fixtures/receipt-app,
  # with real Playwright screenshots: once with a fake preview deployment and once without. Only
  # Chromium's headless shell is installed, and cached by Playwright version.
  receipt:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    env:
      PLAYWRIGHT_VERSION: 1.64.1
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check that action/index.mjs is built from the current source
        run: |
          pnpm --filter @selfhost/ee-receipt bundle
          git diff --exit-code ee/receipt/action || {
            echo "::error::ee/receipt/action/index.mjs is out of date. Run: pnpm --filter @selfhost/ee-receipt bundle"
            exit 1
          }
      - name: Install playwright-core next to the action, as action.yml does
        run: |
          npm install --prefix "$RUNNER_TEMP/playwright" --no-save --no-audit --no-fund \
            --loglevel=error "playwright-core@$PLAYWRIGHT_VERSION"
          echo "SELFHOST_RECEIPT_PLAYWRIGHT=$RUNNER_TEMP/playwright/node_modules/playwright-core" >> "$GITHUB_ENV"
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: playwright-chromium-${{ runner.os }}-${{ env.PLAYWRIGHT_VERSION }}
      - run: '"$RUNNER_TEMP/playwright/node_modules/.bin/playwright-core" install --only-shell chromium'
      - name: Run the receipt end to end
        run: pnpm --filter @selfhost/ee-receipt exec vitest run test/e2e.test.ts
        env:
          SELFHOST_RECEIPT_E2E: "1"

  # Upgrade and rollback on seeded data, on the Postgres version the Docker Compose install pins.
  # There are no tagged releases yet, so the previous release is this checkout without its
  # newest migration: its server writes the data, this release's migrate entry (the one
  # upgrade.sh runs) upgrades and rolls back, and the row counts must match at every step. Then
  # the migration tests, a forced failure included, run on the same Postgres.
  upgrade:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16.15
        env:
          POSTGRES_DB: selfhost
          POSTGRES_USER: selfhost
          POSTGRES_PASSWORD: selfhost
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U selfhost -d selfhost"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://selfhost:selfhost@localhost:5432/selfhost
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
          # The previous release is built from the commit before the newest migration.
          fetch-depth: 0
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # No release is tagged yet, so the previous release is the code as it was just before the
      # newest migration was added: its own server, not this one with a migration removed.
      - name: Build this release's server, and the previous one from before the newest migration
        run: |
          pnpm --filter @selfhost/console build
          pnpm --filter @selfhost/server build
          mv apps/server/dist apps/server/dist-current
          newest=$(ls packages/ledger/migrations/*.sql | grep -v '[.]down[.]sql$' | sort | tail -n 1)
          added=$(git log -1 --format=%H --diff-filter=A -- "$newest")
          echo "previous release: the parent of $added, which added $newest"
          git worktree add --detach "$RUNNER_TEMP/previous" "$added^"
          (cd "$RUNNER_TEMP/previous" && pnpm install --frozen-lockfile \
            && pnpm --filter @selfhost/console build && pnpm --filter @selfhost/server build)
          ln -s "$RUNNER_TEMP/previous/apps/server/dist" apps/server/dist-previous
          git diff --exit-code
      - name: Seed through the previous release, upgrade, roll back and upgrade again
        run: |
          eval "$(grep '^ROWS_SQL=' deploy/docker/backup.sh)"
          rows() { psql "$DATABASE_URL" -tAc "$ROWS_SQL"; }
          # Every table=count of $1 is in $2, schema_migrations aside: no row lost or added.
          kept() {
            for pair in $1; do
              case "$pair" in schema_migrations=*) continue ;; esac
              case " $2 " in *" $pair "*) ;; *) echo "::error::$pair is not in: $2"; return 1 ;; esac
            done
          }
          # Starts a release's server on the database in the background; no job writes on its own.
          serve() {
            SELFHOST_CONSOLE=off SELFHOST_TOKEN=ci-token SELFHOST_RETENTION_SWEEP=off \
              SELFHOST_REVIEW_REFRESH=off SELFHOST_TRACE_EXPORT=off SELFHOST_BACKGROUND=off \
              SELFHOST_CACHE_ALERTS=off SELFHOST_NOTIFY=off PORT=4400 \
              node "apps/server/$1/main.js" > "$RUNNER_TEMP/$1.log" 2>&1 &
            pid=$!
            for _ in $(seq 1 30); do
              curl -fsS http://127.0.0.1:4400/v1/health > /dev/null 2>&1 && return 0
              sleep 1
            done
            cat "$RUNNER_TEMP/$1.log"; return 1
          }
          stop() { kill "$pid"; while kill -0 "$pid" 2> /dev/null; do sleep 0.2; done; }
          api() { curl -fsS -H "Authorization: Bearer ci-token" -H 'Content-Type: application/json' "$@"; }
          events() { api "http://127.0.0.1:4400/v1/events?limit=1000" | jq '.events | length'; }
          migrate() { node "apps/server/$1/migrate.js" "${@:2}"; }

          previous=$(migrate dist-previous --status | jq -r .latest)
          latest=$(migrate dist-current --status | jq -r .latest)
          echo "previous release: $previous, this release: $latest"

          serve dist-previous
          jq -s '{events: .}' "$RUNNER_TEMP/previous/packages/schema/fixtures/event/valid/"*.json > "$RUNNER_TEMP/events.json"
          fixtures=$(jq '.events | length' "$RUNNER_TEMP/events.json")
          api -X POST --data-binary @"$RUNNER_TEMP/events.json" http://127.0.0.1:4400/v1/events \
            | jq -e --argjson n "$fixtures" '.accepted == $n'
          invite=$(api -X POST -d '{"name":"CI"}' http://127.0.0.1:4400/v1/teams | jq -r .invite)
          curl -fsS -H 'Content-Type: application/json' -X POST \
            -d "{\"invite\":\"$invite\",\"person\":\"ci@example.com\"}" http://127.0.0.1:4400/v1/join > /dev/null
          [ "$(events)" = "$fixtures" ]
          stop
          before=$(rows)
          echo "rows at $previous: $before"

          migrate dist-current
          kept "$before" "$(rows)"
          # The previous release now refuses to start against the newer schema.
          code=0
          SELFHOST_CONSOLE=off SELFHOST_TOKEN=ci-token PORT=4400 timeout 30 \
            node apps/server/dist-previous/main.js > "$RUNNER_TEMP/refused.log" 2>&1 || code=$?
          cat "$RUNNER_TEMP/refused.log"
          [ "$code" = 1 ] || { echo "::error::the previous release did not refuse the newer schema ($code)"; exit 1; }
          grep -q "newer than this release" "$RUNNER_TEMP/refused.log"

          migrate dist-current --to "$previous"
          [ "$(rows)" = "$before" ] || { echo "::error::rows after the rollback: $(rows)"; exit 1; }
          serve dist-previous
          [ "$(events)" = "$fixtures" ]
          stop

          migrate dist-current
          kept "$before" "$(rows)"
          serve dist-current
          [ "$(events)" = "$fixtures" ]
          stop
          migrate dist-current --status | jq -e --arg v "$latest" '.current == $v and .pending == [] and .unknown == []'
      - name: Down migrations, a forced failure and a newer schema on the same Postgres
        run: pnpm --filter @selfhost/ledger exec vitest run test/upgrade.test.ts test/migrations.test.ts

  # The Docker Compose install end to end: build, health checks, writes through the API and the
  # collector, an upgrade, then a backup restored into a fresh volume.
  compose:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    defaults:
      run:
        working-directory: deploy/docker
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Write .env as the install guide does
        run: |
          cp .env.example .env
          for key in POSTGRES_PASSWORD SELFHOST_TOKEN SELFHOST_OTLP_TOKEN; do
            sed -i "s/^$key=$/$key=$(openssl rand -hex 32)/" .env
          done
          # A local image name, so nothing is pulled for the server.
          sed -i "s/^SELFHOST_VERSION=.*/SELFHOST_VERSION=ci-1/" .env
          echo "SELFHOST_IMAGE=selfhost-ci" >> .env
          # The fixture events are dated, so the retention sweep would delete them as they age.
          echo "SELFHOST_RETENTION_SWEEP=off" >> .env
          cat > "$RUNNER_TEMP/compose-ci.sh" <<'SH'
          # Read, not exported: compose must keep taking its settings from .env.
          SELFHOST_TOKEN=$(sed -n 's/^SELFHOST_TOKEN=//p' .env)
          SELFHOST_OTLP_TOKEN=$(sed -n 's/^SELFHOST_OTLP_TOKEN=//p' .env)
          api() {
            path=$1
            shift
            curl -fsS -H "Authorization: Bearer $SELFHOST_TOKEN" "$@" "http://127.0.0.1:4400$path"
          }
          event_count() {
            total=0 cursor=""
            while :; do
              page=$(api "/v1/events?limit=1000${cursor:+&cursor=$(jq -rn --arg c "$cursor" '$c|@uri')}")
              total=$((total + $(echo "$page" | jq '.events | length')))
              cursor=$(echo "$page" | jq -r '.next_cursor // empty')
              [ -n "$cursor" ] || break
            done
            echo "$total"
          }
          wait_healthy() {
            for _ in $(seq 1 90); do
              waiting=""
              for svc in postgres selfhost otel-collector; do
                id=$(docker compose ps -q "$svc")
                status=$([ -n "$id" ] && docker inspect -f '{{.State.Health.Status}}' "$id" || echo missing)
                [ "$status" = healthy ] || waiting="$waiting $svc=$status"
              done
              if [ -z "$waiting" ]; then docker compose ps; return 0; fi
              sleep 2
            done
            echo "::error::Not healthy:$waiting"
            docker compose ps -a
            docker compose logs --no-color
            return 1
          }
          wait_for_count() {
            for _ in $(seq 1 30); do
              [ "$(event_count)" = "$1" ] && return 0
              sleep 2
            done
            echo "::error::Expected $1 events, found $(event_count)"
            docker compose logs --no-color otel-collector selfhost
            return 1
          }
          SH

      - name: Fail on images that use latest or have no tag
        run: |
          fail=0
          for image in $(docker compose config --images); do
            ref=${image##*/}
            case "$ref" in
              *@sha256:*) continue ;;
              *:*) tag=${ref#*:} ;;
              *) echo "::error::$image has no tag"; fail=1; continue ;;
            esac
            case "$tag" in *latest*) echo "::error::$image uses latest"; fail=1 ;; esac
          done
          exit "$fail"

      - name: Build the server image and start the stack
        run: |
          . "$RUNNER_TEMP/compose-ci.sh"
          docker compose build selfhost
          docker compose up -d
          wait_healthy

      - name: Write fixture events through the API and an OTLP payload through the collector
        run: |
          . "$RUNNER_TEMP/compose-ci.sh"
          jq -s '{events: .}' ../../packages/schema/fixtures/event/valid/*.json > "$RUNNER_TEMP/events.json"
          fixtures=$(jq '.events | length' "$RUNNER_TEMP/events.json")
          api /v1/events -X POST -H 'Content-Type: application/json' \
            --data-binary @"$RUNNER_TEMP/events.json" | tee "$RUNNER_TEMP/ingest.json"
          jq -e --argjson n "$fixtures" '.accepted == $n and .duplicates == 0' "$RUNNER_TEMP/ingest.json"

          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:4318/v1/logs \
            -H 'Content-Type: application/json' --data-binary @../../fixtures/sources/otel/claude-code-logs.json)
          [ "$code" = 401 ] || { echo "::error::Collector accepted logs without a token ($code)"; exit 1; }
          curl -fsS -X POST http://127.0.0.1:4318/v1/logs \
            -H "Authorization: Bearer $SELFHOST_OTLP_TOKEN" -H 'Content-Type: application/json' \
            --data-binary @../../fixtures/sources/otel/claude-code-logs.json
          curl -fsS -X POST http://127.0.0.1:4318/v1/metrics \
            -H "Authorization: Bearer $SELFHOST_OTLP_TOKEN" -H 'Content-Type: application/json' \
            -d '{"resourceMetrics":[{"scopeMetrics":[{"metrics":[{"name":"claude_code.session.count","sum":{"dataPoints":[{"asInt":"1","timeUnixNano":"1791295335204000000"}],"aggregationTemporality":1,"isMonotonic":true}}]}]}]}'

          # The fixture events, plus the 6 events the OTel mapper makes of the logs payload.
          wait_for_count $((fixtures + 6))
          api "/v1/events?session=a20d0d4b-8ee2-4416-b55d-ae9364eb8461&limit=100" \
            | jq -e '[.events[] | select(.source == "otel")] | length == 6'
          if docker compose logs --no-color otel-collector | grep -i 'exporting failed'; then
            echo "::error::The collector failed to export to the server"; exit 1
          fi

      - name: Upgrade with one command and keep the events
        run: |
          . "$RUNNER_TEMP/compose-ci.sh"
          before=$(event_count)
          # Stands in for publishing the next release.
          SELFHOST_VERSION=ci-2 docker compose build selfhost
          ./upgrade.sh ci-2
          wait_healthy
          docker compose ps selfhost --format '{{.Image}}' | grep -qx 'selfhost-ci:ci-2'
          grep -qx 'SELFHOST_VERSION=ci-2' .env
          after=$(event_count)
          echo "events before upgrade: $before, after: $after"
          [ "$before" -gt 0 ] && [ "$after" = "$before" ]

      - name: Roll back with the same command, and keep running when the next release's migrations fail
        run: |
          . "$RUNNER_TEMP/compose-ci.sh"
          before=$(event_count)
          ./upgrade.sh ci-1
          wait_healthy
          docker compose ps selfhost --format '{{.Image}}' | grep -qx 'selfhost-ci:ci-1'
          [ "$(event_count)" = "$before" ]

          # A release whose migrate step fails. The failing SQL itself, rolled back in its
          # transaction, is tested on this Postgres version in the upgrade job.
          docker build -t selfhost-ci:ci-bad - <<'EOF'
          FROM selfhost-ci:ci-1
          USER root
          RUN mv dist/migrate.js dist/migrate-real.js && printf '%s\n' \
            'if (!process.argv.includes("--status")) { console.error("forced migration failure"); process.exit(1); }' \
            'await import("./migrate-real.js");' > dist/migrate.js
          USER node
          EOF
          if ./upgrade.sh ci-bad 2> "$RUNNER_TEMP/bad.log"; then
            echo "::error::upgrade.sh switched to a release whose migrations failed"; exit 1
          fi
          cat "$RUNNER_TEMP/bad.log"
          grep -q 'and ci-1 keeps running' "$RUNNER_TEMP/bad.log"
          grep -qx 'SELFHOST_VERSION=ci-1' .env
          wait_healthy
          docker compose ps selfhost --format '{{.Image}}' | grep -qx 'selfhost-ci:ci-1'
          [ "$(event_count)" = "$before" ]

      - name: Back up, restore into a fresh volume, and compare event and row counts
        run: |
          . "$RUNNER_TEMP/compose-ci.sh"
          before=$(event_count)
          ./backup.sh "$RUNNER_TEMP/selfhost.dump" | tee "$RUNNER_TEMP/backup.log"

          docker compose down --volumes
          docker compose up -d
          wait_healthy
          [ "$(event_count)" = 0 ]

          ./restore.sh "$RUNNER_TEMP/selfhost.dump" | tee "$RUNNER_TEMP/restore.log"
          wait_healthy
          after=$(event_count)
          echo "events backed up: $before, restored: $after"
          [ "$after" = "$before" ]
          backed=$(sed -n 's/^rows: //p' "$RUNNER_TEMP/backup.log")
          restored=$(sed -n 's/^rows: //p' "$RUNNER_TEMP/restore.log")
          case "$backed" in *events=*) ;; *) echo "::error::backup.sh printed no row counts"; exit 1 ;; esac
          [ "$backed" = "$restored" ] || { echo "::error::rows backed up: $backed, restored: $restored"; exit 1; }

          if ./restore.sh "$RUNNER_TEMP/selfhost.dump"; then
            echo "::error::restore.sh replaced a database with events without --force"; exit 1
          fi
          wait_healthy
          [ "$(event_count)" = "$before" ]

      - name: Send a test and an instant push by email through Apprise to a local SMTP catcher
        run: |
          . "$RUNNER_TEMP/compose-ci.sh"
          # Mailpit stands in for the mail server: nothing leaves the runner.
          cat > "$RUNNER_TEMP/compose.mailpit.yml" <<'EOF'
          services:
            mailpit:
              image: axllent/mailpit:v1.32.0
              ports:
                - "127.0.0.1:8025:8025"
          EOF
          export COMPOSE_FILE="compose.yml:compose.notify.yml:$RUNNER_TEMP/compose.mailpit.yml"
          docker compose up -d
          wait_healthy

          invite=$(api /v1/teams -X POST -H 'Content-Type: application/json' -d '{"name":"Notify"}' | jq -r .invite)
          dev=$(curl -fsS -X POST http://127.0.0.1:4400/v1/join -H 'Content-Type: application/json' \
            -d "{\"invite\":\"$invite\",\"person\":\"notify@example.com\"}" | jq -r .token)
          as_dev() {
            path=$1
            shift
            curl -fsS -H "Authorization: Bearer $dev" -H 'Content-Type: application/json' "$@" "http://127.0.0.1:4400$path"
          }
          target='mailto://mailpit:1025?from=selfhost@example.com&to=notify@example.com'
          as_dev /v1/notify/targets -X POST -d "{\"url\":\"$target\",\"name\":\"email\"}" \
            | jq -e '.targets[0].masked == "mailto://****" and .delivery == "apprise_api"'
          # Apprise may still be starting: the test send is tried until it goes.
          for _ in $(seq 1 20); do
            as_dev /v1/notify/test -X POST -d '{}' | jq -e '.sends[0].ok' && break
            sleep 3
          done

          # An agent waiting on them: pushed at once. A new target's first digest waits for the next
          # [notify] digest_hour, which the notify unit tests cover with a fake clock.
          now=$(date -u +%Y-%m-%dT%H:%M:%S.000Z)
          as_dev /v1/events -X POST -d "{\"events\":[{\"id\":\"01930c4e-2f1a-7b2c-8d3e-00000000c1c1\",
            \"schema\":\"selfhost.event/v1\",\"ts\":\"$now\",\"source\":\"hook\",\"kind\":\"approval.requested\",
            \"session_id\":\"ci-notify\",\"agent\":{\"vendor\":\"claude_code\"},
            \"tool\":{\"name\":\"Bash\",\"input_summary\":\"cat ci-secret-file\"}}]}"
          for _ in $(seq 1 60); do
            subjects=$(curl -fsS http://127.0.0.1:8025/api/v1/messages | jq -r '.messages[].Subject')
            case "$subjects" in *"an agent waits"*) break ;; esac
            sleep 3
          done
          echo "$subjects"
          echo "$subjects" | grep -qx 'selfhost: test notification'
          echo "$subjects" | grep -qx 'selfhost: Approval, an agent waits'
          # Summaries and links only: the tool input never reaches a message.
          for id in $(curl -fsS http://127.0.0.1:8025/api/v1/messages | jq -r '.messages[].ID'); do
            if curl -fsS "http://127.0.0.1:8025/api/v1/message/$id" | jq -r .Text | grep -q 'ci-secret-file'; then
              echo "::error::A message carried the agent's tool input"; exit 1
            fi
          done
          # Every send is recorded by target name, never with the URL.
          as_dev /v1/notify/sends > "$RUNNER_TEMP/sends.json"
          jq -e '[.sends[] | select(.ok)] | map(.kind) | sort == ["item", "test"]' "$RUNNER_TEMP/sends.json"
          if grep -q 'mailpit:1025' "$RUNNER_TEMP/sends.json" || docker compose logs --no-color selfhost | grep -q 'mailpit:1025'; then
            echo "::error::A target URL was returned or logged"; exit 1
          fi

      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop the stack
        if: always()
        run: docker compose down --volumes

  # install.sh with the HTTPS, sign-in and gateway overlays, the way selfhost up runs it on a
  # server: first with no secret in .env, then again with sign-in, then with the AI gateway. SELFHOST_DOMAIN=localhost, so Caddy serves
  # HTTPS from its own local CA and no DNS or Let's Encrypt is involved.
  install:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20
    defaults:
      run:
        working-directory: deploy/docker
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Build the server image
        run: docker build -f Dockerfile -t selfhost-ci:ci-1 ../..

      - name: Write the check helpers
        run: |
          cat > "$RUNNER_TEMP/install-ci.sh" <<'SH'
          ca="$RUNNER_TEMP/caddy-root.crt"
          # HTTPS checked against Caddy's local CA, not skipped.
          https() { curl -sS --cacert "$ca" "$@"; }
          status() { https -o /dev/null -w '%{http_code}' "$@"; }
          wait_https() {
            for _ in $(seq 1 60); do
              if sudo docker compose exec -T caddy cat /data/caddy/pki/authorities/local/root.crt > "$ca" 2>/dev/null \
                && https -f https://localhost/v1/health | jq -e '.ok == true' >/dev/null; then
                return 0
              fi
              sleep 2
            done
            echo "::error::https://localhost/v1/health did not answer"
            sudo docker compose ps -a
            sudo docker compose logs --no-color --tail 50
            return 1
          }
          secrets() { sudo grep -E '^(POSTGRES_PASSWORD|SELFHOST_TOKEN|SELFHOST_OTLP_TOKEN|SELFHOST_SIGNIN_COOKIE_SECRET)=' .env; }
          SH

      - name: Install with HTTPS and no secret in .env, as the cloud-init user-data does
        run: |
          . "$RUNNER_TEMP/install-ci.sh"
          cat > .env.next <<'EOF'
          COMPOSE_FILE=compose.yml:compose.tls.yml
          SELFHOST_IMAGE=selfhost-ci
          SELFHOST_VERSION=ci-1
          POSTGRES_PASSWORD=
          SELFHOST_TOKEN=
          SELFHOST_OTLP_TOKEN=
          SELFHOST_SIGNIN_COOKIE_SECRET=
          SELFHOST_BIND=127.0.0.1
          OTLP_BIND=127.0.0.1
          SELFHOST_DOMAIN=localhost
          SELFHOST_PUBLIC_URL=https://localhost
          EOF
          sudo ./install.sh
          [ "$(sudo stat -c %a .env)" = 600 ]
          # Every secret was generated on the server.
          [ "$(secrets | grep -c '=.\{32,\}$')" = 4 ]
          wait_https
          # The console page asks for a token; it holds no data itself.
          [ "$(status https://localhost/)" = 200 ]
          https -f https://localhost/ | grep -qi '<!doctype html>'

      - name: Keep the API and the collector off the network, and route /v1 and /otlp through Caddy
        run: |
          . "$RUNNER_TEMP/install-ci.sh"
          [ "$(sudo docker compose port selfhost 4400)" = 127.0.0.1:4400 ]
          [ "$(sudo docker compose port otel-collector 4318)" = 127.0.0.1:4318 ]
          ip=$(hostname -I | awk '{print $1}')
          for port in 4400 4317 4318; do
            if curl -s --max-time 3 -o /dev/null "http://$ip:$port/"; then
              echo "::error::port $port answers on $ip"; exit 1
            fi
          done
          admin=$(sudo sed -n 's/^SELFHOST_TOKEN=//p' .env)
          otlp=$(sudo sed -n 's/^SELFHOST_OTLP_TOKEN=//p' .env)
          [ "$(status "https://localhost/v1/events?limit=1")" = 401 ]
          https -f -H "Authorization: Bearer $admin" "https://localhost/v1/events?limit=1" | jq -e '.events'
          [ "$(status -X POST -H 'Content-Type: application/json' -d '{"resourceLogs":[]}' https://localhost/otlp/v1/logs)" = 401 ]
          https -f -X POST -H "Authorization: Bearer $otlp" -H 'Content-Type: application/json' \
            -d '{"resourceLogs":[]}' https://localhost/otlp/v1/logs

      - name: Turn on sign-in with a second run, keeping every secret
        run: |
          . "$RUNNER_TEMP/install-ci.sh"
          before=$(secrets)
          cat > .env.next <<'EOF'
          COMPOSE_FILE=compose.yml:compose.tls.yml:compose.signin.yml
          SELFHOST_SIGNIN_PROVIDER=github
          SELFHOST_SIGNIN_CLIENT_ID=ci-client-id
          SELFHOST_SIGNIN_CLIENT_SECRET=ci-client-secret
          SELFHOST_SIGNIN_EMAIL_DOMAINS=example.com
          SELFHOST_SIGNIN_GITHUB_ORG=
          EOF
          sudo ./install.sh
          [ "$(secrets)" = "$before" ]
          wait_https
          # The console sends people to sign in, and sign-in sends them to GitHub with this app.
          console=$(https -o /dev/null -w '%{redirect_url}' https://localhost/)
          case "$console" in
            https://localhost/oauth2/sign_in\?rd=*) ;;
            *) echo "::error::the console redirected to '$console'"; exit 1 ;;
          esac
          github=$(https -o /dev/null -w '%{redirect_url}' https://localhost/oauth2/sign_in)
          case "$github" in
            https://github.com/login/oauth/authorize\?*client_id=ci-client-id*) ;;
            *) echo "::error::sign-in redirected to '$github'"; exit 1 ;;
          esac
          # The API keeps its bearer tokens, with no sign-in.
          [ "$(status https://localhost/v1/health)" = 200 ]
          # Sign-in headers a client sends itself are dropped before the server sees them.
          [ "$(status -H 'X-Selfhost-Email: someone@example.com' -H 'X-Selfhost-Proxy-Secret: guess' \
            "https://localhost/v1/events?limit=1")" = 401 ]
          # Every image of the three files, as Compose resolves them, has an exact tag.
          for image in $(sudo docker compose config --images); do
            ref=${image##*/}
            case "$ref" in
              selfhost-ci:*|*@sha256:*) continue ;;
              *:*latest*) echo "::error::$image uses latest"; exit 1 ;;
              *:*) ;;
              *) echo "::error::$image has no tag"; exit 1 ;;
            esac
          done

      - name: Turn on the AI gateway with a third run, and check Bifrost behind Caddy
        run: |
          . "$RUNNER_TEMP/install-ci.sh"
          before=$(secrets)
          # One provider with a dummy key, so a request reaches Bifrost's virtual key check (which
          # runs after it looks up the provider). Nothing here is let through to a provider, and
          # the dummy key would not work if it were.
          cat > .env.next <<'EOF'
          COMPOSE_FILE=compose.yml:compose.tls.yml:compose.signin.yml:compose.gateway.yml
          ANTHROPIC_API_KEY=ci-dummy-not-a-real-key
          EOF
          sudo ./install.sh
          [ "$(secrets)" = "$before" ]
          [ "$(sudo grep -cE '^SELFHOST_GATEWAY_(ADMIN|ENCRYPTION)_KEY=.{32,}$' .env)" = 2 ]
          # bifrost.json names every secret by reference only.
          if sudo grep -qF "$(sudo sed -n 's/^SELFHOST_GATEWAY_ADMIN_KEY=//p' .env)" bifrost.json \
            || sudo grep -qF ci-dummy-not-a-real-key bifrost.json; then
            echo "::error::bifrost.json holds a secret"; exit 1
          fi
          sudo jq -e '.providers.anthropic.keys[0].value == "env.ANTHROPIC_API_KEY"' bifrost.json
          wait_https
          # Bifrost answers its health check behind Caddy, and only on 127.0.0.1 itself.
          https -f https://localhost/llm/health | jq -e '.status == "ok"'
          [ "$(sudo docker compose port bifrost 8080)" = 127.0.0.1:8080 ]
          ip=$(hostname -I | awk '{print $1}')
          if curl -s --max-time 3 -o /dev/null "http://$ip:8080/health"; then
            echo "::error::Bifrost answers on $ip"; exit 1
          fi
          # Its management API and UI are not routed; model routes refuse requests without a
          # virtual key or with one it does not know.
          [ "$(status https://localhost/llm/api/governance/virtual-keys)" = 404 ]
          # A well-formed request to the configured provider, so a refusal can only be about the
          # key: Bifrost's governance answers 401 for a missing or unknown virtual key.
          refused() {
            body=$(https -s -o - -w '\n%{http_code}' -X POST -H 'Content-Type: application/json' "$@" \
              -d '{"model":"anthropic/claude-haiku-5-5","messages":[{"role":"user","content":"hi"}]}' \
              https://localhost/llm/v1/chat/completions)
            code=${body##*$'\n'}
            case "$code" in 401|403) return 0 ;; esac
            echo "::error::the request with '$2' answered $code: ${body%$'\n'*}"; return 1
          }
          refused -H 'X-Selfhost-Check: no-key' || exit 1
          refused -H 'Authorization: Bearer sk-bf-not-a-key' || exit 1

          # The server writes a team and a person's key with its budget, and syncs again cleanly.
          admin=$(sudo sed -n 's/^SELFHOST_TOKEN=//p' .env)
          api() { https -f -H "Authorization: Bearer $1" -H 'Content-Type: application/json' "${@:2}"; }
          invite=$(api "$admin" -X POST -d '{"name":"CI"}' https://localhost/v1/teams | jq -r .invite)
          person=$(https -f -H 'Content-Type: application/json' -X POST \
            -d "{\"invite\":\"$invite\",\"person\":\"ci@example.com\"}" https://localhost/v1/join | jq -r .token)
          api "$person" -X PUT -d '{"text":"version = 1\n[budget]\nmode = \"hard\"\nmonthly_usd = 10\n[budget.person]\ndaily_usd = 1\n"}' \
            https://localhost/v1/policy >/dev/null
          api "$person" -X POST -d '{}' https://localhost/v1/gateway/keys > "$RUNNER_TEMP/key.json"
          jq -e '(.value | startswith("sk-bf-")) and ([.key.budgets[] | {period, limit_usd}] == [{"period":"day","limit_usd":1}])' "$RUNNER_TEMP/key.json"
          [ "$(status -X POST -H "Authorization: Bearer $person" -H 'Content-Type: application/json' -d '{}' \
            https://localhost/v1/gateway/keys)" = 409 ]
          api "$admin" -X POST https://localhost/v1/gateway/sync | jq -e '.errors == []'
          # Safe to rerun: a second sync finds nothing to change.
          api "$admin" -X POST https://localhost/v1/gateway/sync | jq -e '.errors == [] and .created == 0 and .updated == 0'
          api "$person" https://localhost/v1/gateway | jq -e '.healthy and .mode == "hard" and .key.person == "ci@example.com"'
          # The key's value is never listed again.
          api "$admin" "https://localhost/v1/gateway/keys?team=ci" > "$RUNNER_TEMP/keys.json"
          jq -e '.keys | length == 1' "$RUNNER_TEMP/keys.json"
          if grep -qF "$(jq -r .value "$RUNNER_TEMP/key.json")" "$RUNNER_TEMP/keys.json"; then
            echo "::error::the key list holds a key's value"; exit 1
          fi

      - name: Run the daily backup once
        run: |
          systemctl is-enabled selfhost-backup.timer
          sudo systemctl start selfhost-backup.service
          sudo sh -c 'ls backups/selfhost-*.dump'

      - name: Show logs on failure
        if: failure()
        run: sudo docker compose logs --no-color

      - name: Stop the stack
        if: always()
        run: sudo docker compose down --volumes
