# Cases for presets/oss.toml: one tool call each and the decision it should get.
# Run them with: selfhost policy test presets/oss.test.toml
#
# decision is block, ask or allow (no rule fires). mode says whether the decision is applied
# (enforce) or only recorded (observe). rules lists exactly the rules that fire.
# A case without a tool runs in Bash.

[[cases]]
name = "npm publish"
command = "npm publish --access public"
decision = "ask"
mode = "enforce"
rules = ["package-publish"]

[[cases]]
name = "pnpm recursive publish"
command = "pnpm -r publish --no-git-checks"
decision = "ask"
mode = "enforce"
rules = ["package-publish"]

[[cases]]
name = "changesets publish"
command = "npx changeset publish"
decision = "ask"
mode = "enforce"
rules = ["package-publish"]

[[cases]]
name = "cargo publish"
command = "cargo publish"
decision = "ask"
mode = "enforce"
rules = ["package-publish"]

[[cases]]
name = "twine upload"
command = "twine upload dist/*"
decision = "ask"
mode = "enforce"
rules = ["package-publish"]

[[cases]]
name = "gradle publish to Maven Central"
command = "./gradlew publishToMavenCentral"
decision = "ask"
mode = "enforce"
rules = ["package-publish"]

[[cases]]
name = "Codex runs npm publish"
tool = "exec_command"
command = 'bash -lc "npm publish"'
decision = "ask"
mode = "enforce"
rules = ["package-publish"]

[[cases]]
name = "npm publish dry run"
command = "npm publish --dry-run"
decision = "allow"
rules = []

[[cases]]
name = "cargo publish dry run"
command = "cargo publish --dry-run"
decision = "allow"
rules = []

[[cases]]
name = "twine check"
command = "twine check dist/*"
decision = "allow"
rules = []

[[cases]]
name = "gradle publish to the local Maven repo"
command = "./gradlew publishToMavenLocal"
decision = "allow"
rules = []

[[cases]]
name = "npm pack"
command = "npm pack"
decision = "allow"
rules = []

[[cases]]
