# Cases for presets/strict.toml: one tool call each and the decision it should get.
# Run them with: selfhost policy test presets/strict.test.toml
#
# decision is block, ask or allow (no rule fires). mode says whether the decision is applied
# (enforce) or only recorded (observe). rules lists exactly the rules that fire.
# A case without a tool runs in Bash.

[[cases]]
name = "live Stripe charge"
command = "stripe charges create --amount 2000 --currency usd --live"
decision = "block"
mode = "enforce"
rules = ["stripe-live"]

[[cases]]
name = "Stripe refund with a live key"
command = "STRIPE_API_KEY=sk_live_51abc stripe refunds create --charge ch_123"
decision = "block"
mode = "enforce"
rules = ["stripe-live"]

[[cases]]
