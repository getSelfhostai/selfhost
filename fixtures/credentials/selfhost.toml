# The policy the credential tests prepare runs against: an enforced egress allow list with a
# narrower list for one team, secrets from env, Vault and Infisical (one injected at egress),
# a provider key the gateway replaces, and a run budget for the run's gateway key. The stores'
# addresses and tokens are the server's environment, set by the tests. The secrets are team
# platform's: its own SELFHOST_RUN_SECRET_PLATFORM__* variables and paths under selfhost/platform/,
# and a shared variable the server allows it.
version = 1

[egress]
mode = "enforce"
allow = ["registry.npmjs.org", "*.pythonhosted.org", "pypi.org", "api.stripe.com", "10.20.0.0/16"]

[teams.payments.egress]
allow = ["registry.npmjs.org", "api.stripe.com"]

[secrets.env]
GITHUB_TOKEN = "github-app:repo"
SENTRY_DSN = "env:SELFHOST_RUN_SECRET_PLATFORM__SENTRY_DSN"
DATABASE_URL = "vault:selfhost/platform/acme-api/ci#database_url"
STRIPE_KEY = { from = "infisical:/selfhost/platform/payments#STRIPE_KEY", host = "api.stripe.com" }
ANTHROPIC_API_KEY = "env:SELFHOST_RUN_SECRET_SHARED__ANTHROPIC_API_KEY"

[budget]
mode = "hard"
run_usd = 5

[integrations.router]
tool = "bifrost"
