# The policy the credential tests prepare runs against: an enforced egress allow list with a
# narrower list for one team, secrets from env, Vault and Infisical (one injected at egress),
# a provider key the gateway replaces, and a run budget for the run's gateway key.
version = 1

[egress]
mode = "enforce"
allow = ["registry.npmjs.org", "*.pythonhosted.org", "pypi.org", "api.stripe.com", "10.20.0.0/16"]

[teams.payments.egress]
allow = ["registry.npmjs.org", "api.stripe.com"]

[secrets.env]
GITHUB_TOKEN = "github-app:repo"
SENTRY_DSN = "env:SENTRY_DSN"
DATABASE_URL = "vault:acme-api/ci#database_url"
STRIPE_KEY = { from = "infisical:/payments#STRIPE_KEY", host = "api.stripe.com" }
ANTHROPIC_API_KEY = "env:ANTHROPIC_API_KEY"

[secrets.vault]
url = "https://vault.acme.test:8200"
namespace = "eng"

[secrets.infisical]
url = "https://infisical.acme.test"
project_id = "proj-acme"
environment = "ci"

[budget]
mode = "hard"
run_usd = 5

[integrations.router]
tool = "bifrost"
